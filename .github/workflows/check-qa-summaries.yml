name: 質問・答弁要約を検査

# 会議録を遡って実装したり、新しい会議録から要約を足したりするたびに、
# 「何について質問したか」「何について答弁したか」が読み取れる形になっているかを
# 自動で確かめる。判定は scripts/qa_summary.py に集約している。
#
# 文の途中で切れている・空・古い文言のままといった機械的に直せる問題があると
# 失敗する。会議録から取り直さないと直らない項目（前置きだけの質問など）は
# 件数を出すだけで失敗にはしない。
#
# あわせて、文としては壊れていないが要約になっていないもの（発言の口語がそのまま
# 残っている、見出しの言い換えで終わっている等）の割合を年ごとに測り、
# scripts/qa_baseline.json の基準値より悪化した場合も失敗する。
# 0件を求めるものではないので、生成を直して改善したときは
# `python3 scripts/check_qa_summaries.py --update-baseline` で基準値を引き直す。

on:
  push:
    paths:
      - "data/**"
      - "scripts/qa_summary.py"
      - "scripts/qa_baseline.json"
      - "scripts/check_qa_summaries.py"
      - "scripts/prepare_committees.py"
      - "scripts/test_committee_excerpt.py"
      - "scripts/repair_qa_summaries.py"
      - "scripts/minutes_fulltext.py"
      - "scripts/check_minutes_fulltext.py"
      - "scripts/test_minutes_fulltext.py"
      - "scripts/prepare_plenary_fulltext.py"
      - "scripts/test_plenary_fulltext.py"
      - "scripts/resolve_speaker.py"
      - "scripts/check_speaker_resolution.py"
      - "scripts/test_speaker_resolution.py"
      - "scripts/speaker-overrides.tsv"
      - "scripts/build_speaker_members.py"
      - ".github/workflows/check-qa-summaries.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/qa_summary.py"
      - "scripts/qa_baseline.json"
      - "scripts/check_qa_summaries.py"
      - "scripts/prepare_committees.py"
      - "scripts/test_committee_excerpt.py"
      - "scripts/repair_qa_summaries.py"
      - "scripts/minutes_fulltext.py"
      - "scripts/check_minutes_fulltext.py"
      - "scripts/test_minutes_fulltext.py"
      - "scripts/prepare_plenary_fulltext.py"
      - "scripts/test_plenary_fulltext.py"
      - "scripts/resolve_speaker.py"
      - "scripts/check_speaker_resolution.py"
      - "scripts/test_speaker_resolution.py"
      - "scripts/speaker-overrides.tsv"
      - "scripts/build_speaker_members.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 実行待ちの時間もこの上限に含まれるため、混雑しても待ちきれるようにしておく
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        # test_committee_excerpt.py が prepare_committees.py を読み込むため。
        # 検査そのもの（check_qa_summaries.py）は標準ライブラリだけで動く。
        run: pip install -r scripts/requirements-history.txt

      - name: 抜粋づくりを試す
        # 会議録なしで動く。節の継ぎ足しと語尾の差し替えが復活していないかを見る
        run: python scripts/test_committee_excerpt.py

      - name: 全文の書き出しを試す
        # 会議録なしで動く。書き換えないこと（write-once）と、抜粋の
        # voiceIndex が全文の同じ発言を指すことを見る
        run: python scripts/test_minutes_fulltext.py

      - name: 本会議の全文づくりを試す
        # 会議録なしで動く。会議録の表題から会議IDを導けること、発言が段落に
        # 分かれること、質問者の入口がその議員の質問を指すことを見る
        run: python scripts/test_plenary_fulltext.py

      - name: 発言者の名寄せを試す
        # 会議録なしで動く。日付で任期を切ること、括弧＝名の先頭1文字、
        # 落選を挟む議員が空白期間で候補から外れることを見る
        run: python scripts/test_speaker_resolution.py

      - name: 要約を検査する
        run: python scripts/check_qa_summaries.py --by-year --details --limit 3

      - name: 会議録全文を検査する
        run: python scripts/check_minutes_fulltext.py --details

      - name: 発言者の名寄せを検査する
        # 索引層は変更しない。どこまで議員IDに解決できるかと、上書き表
        # （scripts/speaker-overrides.tsv）に誤りがないかを見る。
        # 未解決が残っていても失敗させない（--strict を付けると失敗する）
        run: python scripts/check_speaker_resolution.py

      - name: 発言者と議員の対応表が最新か見る
        # data/speaker-members.js は索引層と名簿から作る。索引層を作り直したり
        # 上書き表を足したりしたのに作り直し忘れると、画面の議員ページだけが
        # 古い対応で動いてしまうので、古ければ失敗させる
        run: python scripts/build_speaker_members.py --check
