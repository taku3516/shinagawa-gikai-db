name: 歴史データのチェック

# pages.yml にも同じ検査を入れているが、あちらは main への push でしか
# 動かない。それだけだと、プルリクエストの時点では一度も検査が走らないまま
# 緑になってしまう。取り込む前に気づけるよう、ここで push と
# プルリクエストの両方で回す。
#
# 対象ファイルで絞っていないのは、検査が1秒とかからないためと、
# 絞ると「関係ないファイルだけ直したつもりが壊していた」場合に
# 黙って素通りするため（公開設定のチェックと同じ考え方）。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-rekishi:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: 検査そのものの動作を確認
        run: python3 -m unittest scripts.test_rekishi_data scripts.test_rekishi_links
      - name: 歴史データを検査
        run: python3 scripts/check_rekishi_data.py
