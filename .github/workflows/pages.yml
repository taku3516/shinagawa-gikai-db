name: GitHub Pagesへ公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5
      - name: 公開設定を検査
        run: python3 scripts/check_firebase_sync.py
      - name: 出典リンクを検査
        run: node --test scripts/source-link.test.mjs
      - name: カレンダーの書き出しを検査
        run: |
          node --test scripts/events-ics.test.mjs
          python3 -m unittest scripts.test_events_core scripts.test_events_ics
      - name: 公開ファイルの組み立てを検査
        run: python3 -m unittest scripts.test_build_pages
      - name: 歴史データを検査
        run: |
          python3 -m unittest scripts.test_rekishi_data scripts.test_rekishi_links
          python3 scripts/check_rekishi_data.py
          node --test scripts/kochizu.test.mjs scripts/rekishi-map-links.test.mjs
      - name: 公開ファイルを生成
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: python3 scripts/build_pages.py
      - name: 議会・区政データの整合性を検査
        run: node --test scripts/civic-data.test.mjs scripts/jimujigyo-search.test.mjs scripts/public-comment-council.test.mjs scripts/public-comment-jigyo.test.mjs
      - name: 新着RSSと収録件数を生成
        run: node scripts/build_civic_feeds.mjs _site
      - name: 公開ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
