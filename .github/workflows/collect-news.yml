name: 品川区ニュースを収集

on:
  schedule:
    # 3時間おき（UTCの毎時25分＝日本時間 0:25, 3:25, 6:25 …）。
    # 毎時00分はGitHub全体で予約が集中し、開始が大きく遅れたり実行が飛ぶことがあるため、
    # 混雑を避けた分に寄せている。区の新着は1日数件のため3時間おきで十分間に合う。
    - cron: "25 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-shinagawa-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 収集自体は30秒ほどで終わるが、この上限には実行待ちの時間も含まれる。
    # ランナーの割り当てが混み合うと15分では待ちきれず、収集を始める前に中断される。
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          # push が競合したときに rebase できるよう、履歴ごと取得する
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: ニュースを収集
        run: python scripts/collect_news.py

      - name: 記事の更新があれば保存
        run: |
          scripts/commit_data_update.sh "品川区ニュースを自動更新" data/news-items.js
