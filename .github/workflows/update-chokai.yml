name: 町会・自治会区域データを更新

on:
  schedule:
    # 毎週月曜12:17（日本時間）。混雑しやすい毎時00分を避ける。
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-shinagawa-chokai
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 公式データを取得
        run: |
          python scripts/prepare_chokai.py
          python scripts/prepare_chokai_boundaries.py
          # ためまっぷのrobots.txtに従い、詳細ページは60秒間隔で取得する。
          python scripts/prepare_chokai_profiles.py
          python scripts/export_chokai_kml.py

      - name: 更新があれば保存
        run: |
          if git diff --quiet -- data/chokai.js data/chokai-boundaries.js data/chokai-profiles.js exports/shinagawa-chokai-map.kml; then
            echo "町会・自治会区域データに変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chokai.js data/chokai-boundaries.js data/chokai-profiles.js exports/shinagawa-chokai-map.kml
          git commit -m "町会・自治会区域データを自動更新"
          git push
