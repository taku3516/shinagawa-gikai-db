name: 区の意見募集・結果を収集

# 品川区公式サイトのパブリックコメント（年度別の実施状況と各案件ページ）から、
# 募集期間・応募者数・意見件数・資料リンクを取り出して data/public-comments.js を更新し、
# 委員会で区が報告した議題との対応を data/public-comment-council.js に、
# 計画を挙げる事業との対応を data/public-comment-jigyo.js に書き出す。
# 区サイトへの負荷を避けるため、取得は2秒間隔・週1回にとどめる。
# あわせて、区のオンライン意見交換の場「しなトーク」の取り組みを公開APIから1回の問い合わせで
# 取得し、パブリックコメントとは別の data/shinatalk.js に書き出す。

on:
  schedule:
    # 日本時間の毎週月曜 朝5時半
    - cron: "30 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-shinagawa-public-comments
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 解析処理のテスト
        run: python -m unittest scripts.test_public_comments scripts.test_shinatalk

      - name: 意見募集・結果を取得する
        run: python scripts/public_comments.py --write

      # しなトークはパブコメとは別のデータ。取得に失敗しても区サイトの意見募集の更新は止めない
      - name: しなトークの取り組みを取得する
        continue-on-error: true
        run: python scripts/shinatalk.py --write

      # 委員会の議題（素案・パブコメ結果・策定の報告）との対応は、委員会データの更新も拾うよう毎週作り直す
      - name: 照合処理のテスト
        run: node --test scripts/public-comment-council.test.mjs scripts/public-comment-jigyo.test.mjs

      - name: 委員会の議題と照合する
        run: node scripts/public-comment-council.mjs --write

      # 計画名を根拠法令・目的・概要に挙げる事業（事務事業評価シート）と照合する
      - name: 事業ごとの記録と照合する
        run: node scripts/public-comment-jigyo.mjs --write

      # 書き出した照合結果に、過去のレビューで見つかった誤りが戻っていないかを確かめてから保存する
      - name: 照合結果を実データで検査
        run: node --test scripts/public-comment-links.test.mjs

      - name: 取得結果に更新があれば保存
        run: scripts/commit_data_update.sh "区の意見募集・結果を自動更新" data/public-comments.js data/public-comment-council.js data/public-comment-jigyo.js data/shinatalk.js
