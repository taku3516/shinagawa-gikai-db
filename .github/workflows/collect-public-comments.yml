name: 区の意見募集・結果を収集

# 品川区公式サイトのパブリックコメント（年度別の実施状況と各案件ページ）から、
# 募集期間・応募者数・意見件数・資料リンクを取り出して data/public-comments.js を更新する。
# 区サイトへの負荷を避けるため、取得は2秒間隔・週1回にとどめる。

on:
  schedule:
    # 日本時間の毎週月曜 朝5時半
    - cron: "30 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-shinagawa-public-comments
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 解析処理のテスト
        run: python -m unittest scripts.test_public_comments

      - name: 意見募集・結果を取得する
        run: python scripts/public_comments.py --write

      - name: 取得結果に更新があれば保存
        run: scripts/commit_data_update.sh "区の意見募集・結果を自動更新" data/public-comments.js
