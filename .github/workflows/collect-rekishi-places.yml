name: 歴史の地点を収集

# 品川区公式「指定文化財」から地点データを取り直す。
# 区の指定は増える（令和5年に史跡第25号が追加された）ので、放っておくと
# データが少しずつ古くなる。ニュースや請願と同じように定期実行に乗せる。
#
# 開発環境から品川区公式サイトへ到達できない場合があるため、
# 公式サイトへの取得はGitHub Actions側で行う（請願・陳情の収集と同じ考え方）。
#
# 取得したあと必ず検査を通し、通ったときだけコミットする。
# 件数が前回より大きく減ったときは、収集スクリプト側が書き出しを拒んで
# 失敗する（公式ページの作りが変わって解析が途中までしかできていない可能性）。

on:
  schedule:
    # 日本時間の毎月2日 4時30分。出典リンクの確認とは日をずらしている。
    - cron: "30 19 1 * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "件数が減っても書き出す（区が指定を取り消した場合など）"
        default: false
        type: boolean
  push:
    branches:
      - "claude/**"
    paths:
      - "scripts/prepare_rekishi_places.py"
      - ".github/workflows/collect-rekishi-places.yml"

permissions:
  contents: write

concurrency:
  group: collect-rekishi-places
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 詳細ページ134件の取得に約5分、住所から緯度経度を引くのに約2分かかる。
    # 実行待ちの時間も含まれるので長めにとる。
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          # push が競合したときに rebase できるよう、履歴ごと取得する
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 指定文化財を取り直す
        run: |
          python scripts/prepare_rekishi_places.py --refresh \
            ${{ inputs.allow_shrink && '--allow-shrink' || '' }}

      - name: 歴史データを検査
        # 取得できても中身が壊れていることがある。通らなければコミットしない。
        run: |
          python -m unittest scripts.test_rekishi_data
          python scripts/check_rekishi_data.py

      - name: 保留になった項目を表示
        # 公開しなかったものを実行ログに残す。黙って落ちると気づけない。
        if: always()
        run: |
          if [ -f scripts/out/rekishi/pending.json ]; then
            cat scripts/out/rekishi/pending.json
          else
            echo "保留はありません"
          fi

      - name: 更新があれば保存
        # 作業用ブランチへの push で動かしたときは、確認だけで終える。
        if: github.event_name != 'push'
        run: |
          scripts/commit_data_update.sh "歴史の地点データを自動更新" data/rekishi-places.js
