name: 委員会質疑を会議録から作り直す

# 会議録検索システムと校正原稿PDFから、指定した年の委員会質疑・答弁要約を
# 作り直す。開発環境から会議録へ到達できない場合があるため、取得はここで行う。
#
# 使いどころ:
#   - 質問・答弁要約の作り方を直したあと、過去年に反映する
#   - `scripts/check_qa_summaries.py` の「要改善」を減らす
#   - 新しい年・未収録の年を追加する
#
# 1回の実行で1年分を作り直す。会議録の取得に時間がかかるため、年をまたいで
# まとめて実行はしない。

on:
  workflow_dispatch:
    inputs:
      year:
        description: "作り直す年（2025 / r07 / 令和7 / h30 / 平成30。数字だけの和暦は不可）"
        required: true
        type: string
      refresh:
        description: "取得済みの会議録を使わず取り直す"
        default: false
        type: boolean
      skip_fulltext:
        description: "会議録全文を作り直さない（抜き出し方だけ直すとき）"
        default: false
        type: boolean
      update_baseline:
        description: "品質・量の基準値を引き直す（増減を確認したうえで受け入れるとき）"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: rebuild-shinagawa-committees
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 会議録の取得に時間がかかる。実行待ちの時間もこの上限に含まれる。
    timeout-minutes: 300
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          # push が競合したときに rebase できるよう、履歴ごと取得する
          fetch-depth: 0
          # 会議録全文を入れると履歴の中身が数百MB規模になる。過去のファイル
          # 本体はここでは要らないので、必要になった時点で取りに行かせる。
          filter: blob:none

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        # poppler は校正原稿PDFの読み取りに使う（pdfinfo / pdftotext）
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-history.txt

      - name: 取得済みの会議録を持ち越す
        # scripts/cache は .gitignore しているため、何もしないと実行のたびに
        # 会議録を取り直すことになる（1年あたり約125会議・0.45秒間隔）。
        # 生成の直し方を変えて同じ年を作り直すことは多いので、ここで持ち越す。
        # prepare_committees.py はキャッシュがあれば取得も待機も飛ばす。
        #
        # restore-keys で直前の同じ年を復元する。--refresh で取り直した場合も、
        # その結果が次に引き継がれる。
        uses: actions/cache/restore@v4
        with:
          path: scripts/cache
          key: minutes-${{ inputs.year }}-${{ github.run_id }}
          restore-keys: |
            minutes-${{ inputs.year }}-

      - name: 委員会質疑を作り直す
        # 全文は一度書いたら書き換えないので、抜き出し方を直すだけのときは
        # skip_fulltext を on にすると、全文に差分が出ない
        # （docs/fulltext-minutes-plan.md）。
        run: |
          python scripts/prepare_committees.py --year "${{ inputs.year }}" \
            ${{ inputs.refresh && '--refresh' || '' }} \
            ${{ inputs.skip_fulltext && '--skip-fulltext' || '' }}

      - name: 取得した会議録を残す
        # 生成や検査で止まってもここまで来る（always）。取得だけで1年9分かかる
        # ので、失敗のたびに取り直すと、直しを試すのに毎回9分待つことになる。
        # 実際に平成18年で2回続けて取り直しになった。
        #
        # actions/cache の自動保存は失敗した実行では走らないため、保存を
        # 分けて always で回している。
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/cache
          key: minutes-${{ inputs.year }}-${{ github.run_id }}

      - name: 会議録全文を検査する
        # 抜粋と全文が噛み合っているか（字数、voiceIndex の指す発言者、
        # 取りこぼし、余り）を見る。片方だけ作り直したまま気づかない、
        # という壊れ方をするため、保存する前に確かめる。
        run: |
          python scripts/check_minutes_fulltext.py --year "${{ inputs.year }}" --details

      - name: 要約を検査する
        # 作り直した結果が共通ルールを満たしているかを、保存する前に確かめる。
        #
        # --details で実例を、--year で作り直した年の掲載文そのものを出す。
        # ここで止まったときデータは破棄されるので、数字だけでは何が起きたか
        # 分からない。判断に使う文はログに残しておく必要がある。
        #
        # --year を省くと、実例は全データから先に出会った順に埋まり、
        # ファイル名の若い年（h13）ばかりになる。作り直した年の文が1件も
        # 出てこなかったことがあるので、年を渡している。検査自体は全データ。
        #
        # 生成を直すと量が変わり、基準値から外れて止まる。それが意図した変更
        # なら、増減を確認したうえで update_baseline を on にして流し直す。
        run: |
          python scripts/check_qa_summaries.py --details --limit 8 \
            --year "${{ inputs.year }}" \
            ${{ inputs.update_baseline && '--update-baseline' || '' }}

      - name: 更新があれば保存
        run: |
          scripts/commit_data_update.sh \
            "${{ inputs.year }}年の委員会質疑を会議録から作り直し" \
            data/ docs/ scripts/qa_baseline.json
