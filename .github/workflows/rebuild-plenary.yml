name: 本会議の質問・答弁を会議録から作り直す

# 公式の本会議資料ページと会議録検索システムから、指定した平成年の
# 代表質問・一般質問と答弁の要約（data/hXX.js の qaSummaries）を作り直す。
# 開発環境から会議録へ到達できない場合があるため、取得はここで行う。
#
# 使いどころ:
#   - 質問・答弁要約の作り方を直したあと、過去年に反映する
#   - `scripts/check_qa_summaries.py` の「要改善」を減らす
#
# 委員会側は `rebuild-committees.yml`（西暦を指定）。こちらは平成年を指定する。
# 1回の実行で1年分を作り直す。

on:
  workflow_dispatch:
    inputs:
      year:
        description: "作り直す年（平成。例: 28 → 平成28年）"
        required: true
        type: string
      mode:
        description: "write=作り直して保存 / inspect=公式ページの表の作りをログに出すだけ"
        default: write
        type: choice
        options: [write, inspect]

permissions:
  contents: write

concurrency:
  group: rebuild-shinagawa-plenary
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 会議録の取得に時間がかかる。実行待ちの時間もこの上限に含まれる。
    timeout-minutes: 300
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6
        with:
          # push が競合したときに rebase できるよう、履歴ごと取得する
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 必要なものを入れる
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-history.txt

      - name: 公式ページの表の作りを見る
        if: inputs.mode == 'inspect'
        # 解析が噛み合わないときの調査用。データは書き換えない
        run: python scripts/build_heisei_year.py "${{ inputs.year }}" --inspect

      - name: 本会議の質問・答弁を作り直す
        if: inputs.mode == 'write'
        run: python scripts/build_heisei_year.py "${{ inputs.year }}"

      - name: 要約を検査する
        if: inputs.mode == 'write'
        # 作り直した結果が共通ルールを満たしているかを、保存する前に確かめる
        run: python scripts/check_qa_summaries.py

      - name: 更新があれば保存
        if: inputs.mode == 'write'
        run: |
          scripts/commit_data_update.sh \
            "平成${{ inputs.year }}年の本会議質問・答弁を会議録から作り直し" data/
