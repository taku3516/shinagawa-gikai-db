<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0017c1" />
  <title>会議をまとめて見る | 品川区議会DB</title>
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="site-base.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <link rel="stylesheet" href="site-controls.css" />
  <link rel="stylesheet" href="site-mobile.css" />
  <link rel="stylesheet" href="site-a11y.css" />
  <style>
    /* 配色はサイト共通の site-theme.css（デジタル庁デザインシステム準拠）で
       一元管理している。ここで :root を再定義すると上書きしてしまうので置かない */
    .notice { margin-top:18px; border:1px solid var(--c-border); border-left:4px solid var(--c-main); background:var(--c-main-pale); padding:12px 14px; font-size:13px; line-height:1.75; }
    .chooser-wrap { position:sticky; top:0; z-index:30; border-bottom:1px solid var(--c-border); background:rgba(242, 242, 242, 0.94); box-shadow:0 2px 8px rgba(26, 26, 26,.12); backdrop-filter:blur(8px); }
    .chooser { display:grid; grid-template-columns:minmax(130px,220px) minmax(250px,1fr) auto; gap:10px; align-items:end; padding:12px 0; }
    .field label { display:block; margin-bottom:4px; color:var(--c-ink-soft); font-size:12px; font-weight:900; }
    select { width:100%; min-height:44px; border:1px solid var(--c-border); border-radius:4px; background:#fff; padding:8px 10px; color:var(--c-ink); font:inherit; font-size:16px; font-weight:800; }
    .copy-link { min-height:44px; border:1px solid var(--c-main); border-radius:4px; background:#fff; padding:8px 13px; color:var(--c-main-dark); font:inherit; font-weight:850; cursor:pointer; }
    main section { padding:26px 0 42px; }
    .loading,.error { border:1px dashed var(--c-border); border-radius:4px; background:var(--c-card); padding:24px; }
    .meeting-head { border:1px solid var(--c-border); border-top:5px solid var(--c-main); border-radius:5px; background:var(--c-card); padding:22px; }
    .eyebrow,.badge { display:inline-flex; align-items:center; min-height:26px; border:1px solid var(--c-border); border-radius:999px; background:var(--c-surface-sub); padding:3px 10px; color:var(--c-main-dark); font-size:12px; font-weight:900; }
    .meeting-head h2 { margin:12px 0 8px; font-size:clamp(24px,4vw,38px); line-height:1.25; }
    .meeting-head p { margin:0; color:var(--c-ink-soft); line-height:1.85; }
    .badges { display:flex; flex-wrap:wrap; gap:7px; margin:16px 0 0; }
    .badge--video { border-color:var(--c-video-border); background:var(--c-video-bg); color:var(--c-video); }
    .badge--minutes { border-color:var(--c-minutes-border); background:var(--c-minutes-bg); color:var(--c-minutes); }
    .pills { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .pill { display:inline-flex; align-items:center; min-height:44px; border:1px solid var(--c-border); border-radius:4px; background:#fff; padding:7px 12px; font-size:13px; font-weight:850; }
    .pill--video { border-color:var(--c-video-border); background:var(--c-video-bg); color:var(--c-video); }
    .pill--minutes { border-color:var(--c-minutes-border); background:var(--c-minutes-bg); color:var(--c-minutes); }
    .one-stop-grid { display:grid; gap:14px; margin-top:18px; }
    details.block { border:1px solid var(--c-border); border-radius:5px; background:var(--c-card); scroll-margin-top:95px; overflow:clip; }
    details.block > summary { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center; min-height:64px; padding:14px 16px; cursor:pointer; list-style:none; }
    details.block > summary::-webkit-details-marker { display:none; }
    details.block > summary:hover, details.block[open] > summary { background:var(--c-main-pale); }
    .block-title { font-size:18px; font-weight:900; }
    .count { color:var(--c-ink-soft); font-size:12px; font-weight:850; white-space:nowrap; }
    .toggle { display:grid; place-items:center; width:34px; height:34px; border-radius:4px; background:var(--c-main); color:#fff; font-size:20px; font-weight:900; }
    .toggle::before { content:"+"; } details[open] > summary .toggle::before { content:"−"; }
    .block-body { border-top:1px solid var(--c-border); padding:18px; }
    .timeline { display:grid; gap:10px; }
    .timeline-item { display:grid; grid-template-columns:120px 1fr; gap:14px; border-left:4px solid var(--c-main); background:var(--c-surface-sub); padding:13px; }
    .timeline-item time { color:var(--c-main); font-weight:900; }
    .timeline-item p { margin:5px 0 0; color:var(--c-ink-soft); line-height:1.75; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
    .card,.exchange { border:1px solid var(--c-rule); border-radius:4px; background:#fff; padding:15px; }
    .card h3,.exchange h4 { margin:0 0 8px; font-size:16px; line-height:1.55; }
    .card p { margin:0; color:var(--c-ink-soft); line-height:1.75; }
    .questioner,.committee-session { border:1px solid var(--c-rule); border-radius:4px; background:#fff; padding:16px; margin-bottom:12px; }
    .questioner h3,.committee-session h3 { margin:0 0 6px; }
    .topic-list { color:var(--c-ink-soft); line-height:1.75; }
    .qa-grid { display:grid; gap:10px; margin-top:14px; }
    .qa { border-left:4px solid var(--c-main); border-radius:3px; background:var(--c-surface-sub); padding:14px; scroll-margin-top:100px; }
    .qa h4 { margin:0 0 9px; line-height:1.5; }
    dl { display:grid; grid-template-columns:6em 1fr; gap:7px 12px; margin:0; }
    dt { color:var(--c-main-dark); font-size:13px; font-weight:900; }
    dd { margin:0; color:var(--c-ink-soft); line-height:1.75; }
    .video-connection { margin-top:10px; padding-top:9px; border-top:1px dashed var(--c-border); }
    .committee-topic { margin-top:12px; border-top:1px solid var(--c-rule); padding-top:12px; }
    .committee-topic h4 { margin:0 0 10px; }
    .fulltext-link { display:inline-block; margin-top:10px; color:var(--c-main-dark); font-size:12px; font-weight:800; }
    .empty { color:var(--c-ink-soft); }
    @media(max-width:720px) {
      .chooser { grid-template-columns:1fr; }
      .chooser-wrap { position:static; }
      .timeline-item { grid-template-columns:1fr; gap:5px; }
      dl { grid-template-columns:1fr; gap:2px; }
      dd + dt { margin-top:8px; }
      .meeting-head { padding:17px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">← 品川区議会DB トップへ</a></p>
        <h1>会議をまとめて見る</h1>
        <p class="lead">1つの会議について、日程、議案、請願・陳情、質問と答弁、委員会質疑、録画、会議録を1ページで確認できます。</p>
        <div class="notice"><strong>このページの文章は公式情報を整理・要約したものです。</strong> 正確な発言、議決結果、日程は、各項目の公式リンクで確認してください。録画と質問・答弁は、公式録画の掲載単位で連結しています。</div>
        <nav data-site-nav></nav>
      </div>
    </header>
    <div class="chooser-wrap">
      <div class="container chooser">
        <div class="field"><label for="year-select">年</label><select id="year-select"></select></div>
        <div class="field"><label for="meeting-select">会議</label><select id="meeting-select"></select></div>
        <button class="copy-link" id="copy-link" type="button">この会議のURLをコピー</button>
      </div>
    </div>
    <section><div class="container" id="page-root"><div class="loading" role="status">会議データを読み込んでいます。</div></div></section>
  </main>
  <footer><div class="container">品川区議会DB — 一次情報は品川区議会公式サイトで確認してください。</div></footer>

  <script src="data/site.js"></script>
  <script src="data/r08.js"></script>
  <script src="data/r08-complete.js"></script>
  <script>
    "use strict";
    const db = window.SHINAGAWA_DB;
    const site = db.site;
    const root = document.getElementById("page-root");
    const yearSelect = document.getElementById("year-select");
    const meetingSelect = document.getElementById("meeting-select");
    const loaded = new Set(["data/r08.js", "data/r08-complete.js"]);

    const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => (
      { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
    function loadScript(src) {
      if (loaded.has(src)) return Promise.resolve();
      return new Promise((resolve,reject) => {
        const script=document.createElement("script"); script.src=src;
        script.onload=()=>{ loaded.add(src); resolve(); };
        script.onerror=()=>reject(new Error(`${src} を読み込めませんでした`));
        document.head.appendChild(script);
      });
    }
    async function loadYear(meta) {
      if (!db.years[meta.id]) await loadScript(meta.file);
      const year=db.years[meta.id];
      if (meta.supplement) await loadScript(meta.supplement);
      // 本会議の全文への入口。year.questions を差し替える補足データより後に読む。
      if (meta.plenaryMinutes) await loadScript(`data/${meta.id}-plenary-minutes.js`);
      if (meta.committees && !year.__committeesLoaded) {
        await loadScript(`data/${meta.id}-committees.js`);
        for (const part of year.committeeDataParts || []) await loadScript(`data/${part}`);
        year.__committeesLoaded=true;
      }
      return year;
    }
    function pill(link, labelOverride) {
      const url=String(link.url||""); const external=/^https?:/i.test(url);
      const cls=link.type==="video"?"pill pill--video":/^minutes/.test(link.type||"")?"pill pill--minutes":"pill";
      return `<a class="${cls}" href="${esc(url)}"${external?' target="_blank" rel="noopener"':""}>${esc(labelOverride||link.label)}</a>`;
    }
    function pills(links) { return links?.length ? `<div class="pills">${links.map((l)=>pill(l)).join("")}</div>` : ""; }
    function block(id,title,count,body,open=false) {
      return `<details class="block" id="${esc(id)}"${open?" open":""}><summary><span class="block-title">${esc(title)}</span><span class="count">${esc(count)}</span><span class="toggle" aria-hidden="true"></span></summary><div class="block-body">${body}</div></details>`;
    }
    function videoLink(links) { return (links||[]).find((link)=>link.type==="video"); }
    // 請願・陳情ページの個別URL。受理番号（例: 令和5年 陳情第31号）から作る。
    // 番号が読み取れない行（公式ページの取り込みで列がずれた平成30年など）は件名で検索させる。
    function petitionDetailUrl(petition) {
      const number = String(petition.number || "")
        .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
        .replace(/\s+/g, "");
      const parts = /^(平成|令和)(元|\d{1,2})年(請願|陳情)第(\d{1,3})(?:-(\d{1,2}))?号$/.exec(number);
      if (!parts) {
        return petition.title ? `seigan.html?q=${encodeURIComponent(petition.title)}` : "seigan.html";
      }
      const era = parts[1] === "平成" ? "h" : "r";
      const eraYear = String(parts[2] === "元" ? 1 : Number(parts[2])).padStart(2, "0");
      const kind = parts[3] === "請願" ? "s" : "c";
      return `seigan.html#p-${era}${eraYear}-${kind}${Number(parts[4])}${parts[5] ? `-${parts[5]}` : ""}`;
    }
    function meetingRelated(year,meeting) {
      return {
        bills:(year.bills||[]).filter((x)=>x.meetingId===meeting.id),
        petitions:(year.petitions||[]).filter((x)=>x.meetingId===meeting.id),
        questions:(year.questions||[]).filter((x)=>x.meetingId===meeting.id),
        sessions:(year.committeeSessions||[]).filter((x)=>x.meetingId===meeting.id),
        pending:(year.committeePending||[]).filter((x)=>x.meetingId===meeting.id)
      };
    }
    function timelineHtml(events) {
      return `<div class="timeline">${(events||[]).map((e)=>`<article class="timeline-item"><time>${esc(e.date)}</time><div><strong>${esc(e.title)}</strong><p>${esc(e.description)}</p>${pills(e.links)}</div></article>`).join("")}</div>`;
    }
    function questionsHtml(questions,meeting) {
      const meetingVideo=videoLink(meeting.links);
      return questions.map((q,qIndex)=>{
        const video=videoLink(q.links)||meetingVideo;
        const qa=(q.qaSummaries||[]).map((item,index)=>`<article class="qa" id="qa-${esc(q.meetingId)}-${esc(q.memberId||qIndex)}-${index+1}"><h4>${esc(item.title)}</h4><dl><dt>質問の要約</dt><dd>${esc(item.question)}</dd><dt>答弁の要約</dt><dd>${esc(item.answer)}</dd></dl>${video?`<div class="video-connection">${pill(video,video===meetingVideo?"この会議の公式録画で確認":"この質問者の公式録画で確認")}</div>`:""}</article>`).join("");
        return `<article class="questioner" id="question-${esc(q.meetingId)}-${esc(q.memberId||qIndex)}"><h3>${esc(q.member)}（${esc(q.party)}）</h3><p>${esc(q.kind||"一般質問")}</p><ul class="topic-list">${(q.topics||[]).map((t)=>`<li>${esc(t)}</li>`).join("")}</ul>${qa?`<div class="qa-grid">${qa}</div>`:""}${plenaryFullTextLink(q)}${pills(q.links)}</article>`;
      }).join("");
    }
    // 会議録全文は kaigiroku.html だけが描く。ここは案内するだけにして、
    // 全文の読み込み・表示を2か所に持たない（docs/fulltext-minutes-plan.md）。
    function fullTextLink(session,voiceIndex) {
      if(!session.hasFullText) return "";
      const anchor=voiceIndex?`v${String(voiceIndex).padStart(4,"0")}`:"full";
      const label=voiceIndex?`原文を読む（発言 ${esc(voiceIndex)}）`:"会議録全文を読む";
      return `<a class="fulltext-link" href="kaigiroku.html#committee-${esc(session.id)}-${anchor}">${label}</a>`;
    }
    // 本会議の質問者から原文へ。位置は data/<年>-plenary-minutes.js が持っている。
    function plenaryFullTextLink(question) {
      const start=question.fullText;
      if(!start||!start.sessionId||!start.voiceIndex) return "";
      const anchor=`v${String(start.voiceIndex).padStart(4,"0")}`;
      return `<a class="fulltext-link" href="kaigiroku.html#plenary-${esc(start.sessionId)}-${anchor}">会議録の原文を読む（${esc(question.member)}議員の質問全文へ）</a>`;
    }
    function sessionsHtml(sessions,pending) {
      const published=sessions.map((session)=>`<article class="committee-session" id="committee-${esc(session.id)}"><h3>${esc(session.date)} ${esc(session.committee)}</h3><p>${esc(session.time||"")}／${esc(session.status||"")}</p><p>${esc(session.overview||"")}</p>${(session.topics||[]).map((topic)=>`<section class="committee-topic"><h4>${esc(topic.title)}</h4><div class="qa-grid">${(topic.exchanges||[]).map((x)=>`<article class="qa exchange" id="committee-${esc(session.id)}-${esc(x.id)}"><h4>${esc(x.title||x.speaker)}</h4><dl><dt>発言者</dt><dd>${esc(x.speaker)}</dd><dt>${esc(x.kind||"質問")}</dt><dd>${esc(x.question)}</dd><dt>答弁・対応</dt><dd>${esc(x.answer)}</dd>${x.respondent?`<dt>答弁者</dt><dd>${esc(x.respondent)}</dd>`:""}</dl>${fullTextLink(session,x.voiceIndex)}</article>`).join("")}</div></section>`).join("")}${fullTextLink(session)}${pills(session.links)}</article>`).join("");
      const waiting=pending.map((x)=>`<article class="card"><h3>${esc(x.date)} ${esc(x.committee)}</h3><p>${esc(x.status||"会議録公開待ち")}</p>${x.officialUrl?pills([{type:"official",label:"公式情報を見る",url:x.officialUrl}]):""}</article>`).join("");
      return published+waiting;
    }
    function render(year,meeting) {
      const related=meetingRelated(year,meeting);
      const meetingVideo=videoLink(meeting.links);
      const minutes=(meeting.links||[]).filter((x)=>/^minutes/.test(x.type||""));
      const committeeCount=related.sessions.reduce((n,s)=>n+(s.topics||[]).reduce((m,t)=>m+(t.exchanges||[]).length,0),0);
      const badges=[
        meetingVideo?'<span class="badge badge--video">公式録画あり</span>':"",
        minutes.length?'<span class="badge badge--minutes">会議録あり</span>':"",
        `<span class="badge">議案 ${related.bills.length}件</span>`,
        `<span class="badge">請願・陳情 ${related.petitions.length}件</span>`,
        `<span class="badge">質問者 ${related.questions.length}名</span>`,
        committeeCount?`<span class="badge">委員会質疑 ${committeeCount}件</span>`:""
      ].join("");
      let sections="";
      if ((meeting.events||[]).length) sections+=block(`timeline-${meeting.id}`,"日程・タイムライン",`${meeting.events.length}件`,timelineHtml(meeting.events),true);
      if (related.bills.length) sections+=block(`bills-${meeting.id}`,"議案",`${related.bills.length}件`,`<div class="cards">${related.bills.map((x)=>`<article class="card"><h3>${esc(x.title)}</h3><p>${esc(x.summary||"")}</p>${pills(x.links)}</article>`).join("")}</div>`);
      if (related.petitions.length) sections+=block(`petitions-${meeting.id}`,"請願・陳情",`${related.petitions.length}件`,`<div class="cards">${related.petitions.map((x)=>`<article class="card"><h3>${esc([x.number,x.title].filter(Boolean).join(" "))}</h3><p>${esc(x.summary||x.result||"")}</p><div class="pills"><a class="pill" href="${esc(petitionDetailUrl(x))}">この請願・陳情の経過を見る</a></div>${pills(x.links)}</article>`).join("")}</div>`);
      if (related.questions.length) sections+=block(`questions-${meeting.id}`,"代表質問・一般質問",`${related.questions.length}名`,questionsHtml(related.questions,meeting),true);
      if (related.sessions.length||related.pending.length) sections+=block(`committees-${meeting.id}`,"委員会の質問・答弁",`${related.sessions.length}会議・${committeeCount}件`,sessionsHtml(related.sessions,related.pending));
      if (!sections) sections='<div class="loading">この会議に紐づく詳細データは掲載準備中です。公式リンクをご確認ください。</div>';
      root.innerHTML=`<article class="meeting-head"><span class="eyebrow">${esc(year.label)}・${esc(meeting.monthLabel)}・${esc(meeting.type)}</span><h2>${esc(meeting.name)}</h2><p>${esc(meeting.detailLead||meeting.summary||"")}</p><div class="badges">${badges}</div>${pills(meeting.links)}<div class="pills"><a class="pill" href="kaigiroku.html#meeting-${esc(meeting.id)}">年別の会議録ページで開く</a></div></article><div class="one-stop-grid">${sections}</div>`;
      openHashTarget();
    }
    function setUrl(yearId,meetingId,replace=true,hash="") {
      const params=new URLSearchParams(location.search); params.set("year",yearId); params.set("meeting",meetingId);
      history[replace?"replaceState":"pushState"]({}, "", `${location.pathname}?${params}${hash}`);
    }
    function openHashTarget() {
      if (!location.hash) return;
      const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (!target) return;
      let parent=target.closest("details");
      while(parent){ parent.open=true; parent=parent.parentElement?.closest("details"); }
      requestAnimationFrame(()=>target.scrollIntoView({block:"start"}));
    }
    async function showYear(yearId,requestedMeetingId,replace=true) {
      const meta=site.years.find((x)=>x.id===yearId&&x.available)||site.years.find((x)=>x.id===site.defaultYear);
      root.innerHTML='<div class="loading" role="status">会議データを読み込んでいます。</div>';
      try {
        const year=await loadYear(meta);
        yearSelect.value=meta.id;
        meetingSelect.innerHTML=(year.meetings||[]).map((m)=>`<option value="${esc(m.id)}">${esc(m.monthLabel)}　${esc(m.name)}</option>`).join("");
        const meeting=(year.meetings||[]).find((m)=>m.id===requestedMeetingId)||(year.meetings||[])[0];
        if (!meeting) throw new Error("会議データがありません");
        meetingSelect.value=meeting.id;
        setUrl(meta.id,meeting.id,replace,replace ? location.hash : "");
        render(year,meeting);
      } catch(error) { root.innerHTML=`<div class="error" role="alert"><strong>読み込みに失敗しました。</strong><br>${esc(error.message)}</div>`; }
    }
    async function init() {
      yearSelect.innerHTML=site.years.filter((x)=>x.available).map((x)=>`<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("");
      const params=new URLSearchParams(location.search);
      const initialYear=params.get("year")||site.defaultYear;
      await showYear(initialYear,params.get("meeting"),true);
      yearSelect.addEventListener("change",()=>showYear(yearSelect.value,null,false));
      meetingSelect.addEventListener("change",()=>{
        const year=db.years[yearSelect.value]; const meeting=(year.meetings||[]).find((x)=>x.id===meetingSelect.value);
        if(meeting){ setUrl(yearSelect.value,meeting.id,false); render(year,meeting); }
      });
      window.addEventListener("hashchange",openHashTarget);
      document.getElementById("copy-link").addEventListener("click",async(event)=>{
        try { await navigator.clipboard.writeText(location.href); event.currentTarget.textContent="コピーしました"; }
        catch(_error){ window.prompt("このURLをコピーしてください",location.href); }
        setTimeout(()=>{event.currentTarget.textContent="この会議のURLをコピー";},1800);
      });
    }
    init();
  </script>
  <script src="site-nav.js"></script>
  <script src="site-a11y.js"></script>
</body>
</html>
