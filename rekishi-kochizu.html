<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0017c1" />
  <title>古地図・今昔比較 | 品川区議会DB</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230017c1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="site-base.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <link rel="stylesheet" href="site-controls.css" />
  <link rel="stylesheet" href="site-mobile.css" />
  <link rel="stylesheet" href="site-a11y.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    /* 配色はサイト共通の site-theme.css（デジタル庁デザインシステム準拠）で
       一元管理している。ここで :root を再定義すると上書きしてしまうので置かない */
    button, select { cursor: pointer; }
    .container { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .notice { margin-top:18px; border:1px solid var(--c-border); border-left:4px solid var(--c-main); border-radius:3px; background:var(--c-accent-pale); padding:13px 15px; font-size:calc(13px * var(--fs)); line-height:1.8; }
    main section { padding:26px 0 44px; }

    .panel { border:1px solid var(--c-border); border-radius:3px; background:var(--c-card); }
    .controls { display:grid; gap:14px; padding:16px; margin-bottom:16px; }
    .controls .control-row { align-items:end; }
    .controls .control-field { flex:1 1 210px; }

    /* 透明度は、つまみの位置だけでなく数字でも示す。
       どこまで動かしたかが分かるようにするため。 */
    .fade { display:grid; gap:6px; }
    .fade-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
    .fade-head label { color:var(--c-ink-mute); font-size:calc(12px * var(--fs)); font-weight:700; }
    .fade-value { font-size:calc(13px * var(--fs)); font-weight:700; font-variant-numeric:tabular-nums; }
    .fade input[type="range"] { width:100%; min-height:44px; }
    .fade-ends { display:flex; justify-content:space-between; color:var(--c-ink-soft); font-size:calc(12px * var(--fs)); }

    .overlay-toggle { display:inline-flex; align-items:center; gap:8px; min-height:44px; font-size:calc(13px * var(--fs)); font-weight:700; }
    .overlay-toggle input { width:20px; height:20px; }

    .map-panel { overflow:hidden; }
    #kochizu-map { width:100%; min-height:620px; background:var(--c-map-bg); }
    .map-fallback { display:grid; place-items:center; min-height:620px; padding:24px; text-align:center; line-height:1.8; }
    .map-caption { border-top:1px solid var(--c-border); padding:11px 14px; color:var(--c-ink-soft); font-size:calc(12px * var(--fs)); line-height:1.7; }
    .era-note { margin:0; padding:11px 14px; border-top:1px solid var(--c-border); background:var(--c-surface-sub); font-size:calc(13px * var(--fs)); line-height:1.8; }
    .era-note strong { color:var(--c-main-dark); }

    .pin { display:grid; place-items:center; width:26px; height:26px; border:2px solid #fff; border-radius:50%; background:var(--c-main); box-shadow:0 1px 4px rgba(0,0,0,.5); color:#fff; font-size:12px; font-weight:700; }
    .pin--temple { background:var(--c-accent); }
    .pin--nature { background:#1b6e3c; }
    .pin--building { background:#8a4b00; }
    .leaflet-popup-content { margin:11px 13px; line-height:1.7; font-size:calc(13px * var(--fs)); }
    .leaflet-popup-content h3 { margin:0 0 4px; font-size:calc(14px * var(--fs)); line-height:1.5; }
    .leaflet-popup-content p { margin:0 0 5px; color:var(--c-ink-soft); font-size:calc(12px * var(--fs)); }

    @media (max-width:640px) {
      .container { width:min(100% - 20px, 1180px); }
      #kochizu-map, .map-fallback { min-height:420px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero"><div class="container">
      <p class="breadcrumb"><a href="rekishi.html">← 品川の歴史へ</a></p>
      <h1>古地図・今昔比較</h1>
      <p class="lead">国土地理院が公開している年代別の空中写真を現在の地図に重ね、透明度を変えながら同じ場所の移り変わりを見比べられます。</p>
      <div class="notice"><strong>写真はすべて国土地理院の地理院タイルです。</strong> このサイトに画像を置いてはおらず、表示のたびに国土地理院から読み込んでいます。撮影年は幅のある期間で、区内すべてが同じ日に撮られたものではありません。</div>
      <nav data-site-nav></nav>
    </div></header>

    <section><div class="container">
      <form class="panel controls" id="controls">
        <div class="control-row">
          <!-- 年代は値が多く、ラベルも長いので <select> にしている
               （site-controls.css の「年のように値が多いもの」にあたる）。
               .seg にすると狭い画面で2行以上に折り返し、どれか1つを選ぶ
               という形に見えなくなる。 -->
          <div class="control-field">
            <label for="era">重ねる年代</label>
            <select id="era"></select>
          </div>
          <div class="control-field">
            <label for="base">下に敷く地図</label>
            <select id="base"></select>
          </div>
          <div class="control-field">
            <label for="area">表示する地域</label>
            <select id="area"></select>
          </div>
        </div>

        <div class="fade">
          <div class="fade-head">
            <label for="opacity">重ねた写真の濃さ</label>
            <span class="fade-value" id="opacity-value">70%</span>
          </div>
          <input id="opacity" type="range" min="0" max="100" step="5" value="70"
                 aria-describedby="opacity-hint" />
          <div class="fade-ends" id="opacity-hint"><span>0％＝現在の地図だけ</span><span>100％＝写真だけ</span></div>
        </div>

        <label class="overlay-toggle">
          <input type="checkbox" id="show-places" />
          史跡・寺社の位置を重ねる（選んだ地域だけ）
        </label>
      </form>

      <section class="panel map-panel" aria-label="古地図・今昔比較の地図">
        <div id="kochizu-map"><div class="map-fallback">地図を読み込んでいます。</div></div>
        <p class="era-note" id="era-note"></p>
        <div class="map-caption" id="map-caption"></div>
      </section>
    </div></section>
  </main>

  <footer><div class="container" id="footer-root"></div></footer>

  <script src="data/site.js"></script>
  <script src="data/rekishi.js"></script>
  <script src="data/rekishi-places.js"></script>
  <script src="site-nav.js"></script>
  <script src="site-a11y.js"></script>
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    (() => {
      "use strict";

      const DB = window.SHINAGAWA_DB || {};
      const META = DB.rekishi || null;
      const PLACES = (DB.rekishiPlaces && DB.rekishiPlaces.items) || [];

      const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));

      const GSI = "https://cyberjapandata.gsi.go.jp/xyz";
      const GSI_CREDIT = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>（国土地理院）';

      // 重ねられる年代。品川区の上空で実際にタイルが配信されていることを
      // 1つずつ確かめたものだけを並べている。
      // maxNativeZoom は、その年代の写真が用意されている一番細かい段階。
      // これを超えて拡大したときは、最後の写真を引き伸ばして表示する
      // （指定しないと、拡大したとたんに写真が消えてしまう）。
      const ERAS = [
        {
          id: "ort_USA10", label: "1945〜1950年（米軍撮影）", ext: "png", maxNativeZoom: 17,
          note: "第二次世界大戦の直後に米軍が撮影した写真です。戦災を受けた市街地のようすや、埋め立て前の海岸線が分かります。"
        },
        {
          id: "ort_old10", label: "1961〜1964年", ext: "png", maxNativeZoom: 17,
          note: "東京オリンピック（1964年）の前後です。首都高速や新幹線の工事が進んでいた時期にあたります。"
        },
        { id: "gazo1", label: "1974〜1978年", ext: "jpg", maxNativeZoom: 17, note: "高度経済成長が終わったころのようすです。" },
        { id: "gazo2", label: "1979〜1983年", ext: "jpg", maxNativeZoom: 17, note: "" },
        { id: "gazo3", label: "1984〜1986年", ext: "jpg", maxNativeZoom: 17, note: "" },
        { id: "gazo4", label: "1988〜1990年", ext: "jpg", maxNativeZoom: 17, note: "" },
        { id: "seamlessphoto", label: "2007年ごろ〜現在", ext: "jpg", maxNativeZoom: 18, note: "もっとも新しい空中写真です。撮影時期は場所によって異なります。" }
      ];

      const BASES = [
        { id: "pale", label: "地理院 淡色地図", ext: "png", maxNativeZoom: 18, credit: GSI_CREDIT },
        { id: "std", label: "地理院 標準地図", ext: "png", maxNativeZoom: 18, credit: GSI_CREDIT },
        { id: "osm", label: "OpenStreetMap", credit: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>' }
      ];

      const PIN_LETTERS = { site: "史", temple: "社", nature: "木", building: "建" };

      const mapRoot = document.getElementById("kochizu-map");
      const captionBox = document.getElementById("map-caption");

      function fail(message) {
        mapRoot.innerHTML = `<div class="map-fallback">${esc(message)}</div>`;
        captionBox.textContent = "";
      }

      if (!META) {
        fail("data/rekishi.js を読み込めませんでした。");
        return;
      }
      if (typeof window.L === "undefined") {
        fail("地図ライブラリを読み込めませんでした。通信環境によっては取得できないことがあります。");
        document.getElementById("controls").hidden = true;
        return;
      }

      const eraSelect = document.getElementById("era");
      const baseSelect = document.getElementById("base");
      const areaSelect = document.getElementById("area");
      const opacityInput = document.getElementById("opacity");
      const opacityValue = document.getElementById("opacity-value");
      const showPlaces = document.getElementById("show-places");

      eraSelect.innerHTML = ERAS.map((x, index) =>
        `<option value="${esc(x.id)}"${index === 0 ? " selected" : ""}>${esc(x.label)}</option>`).join("");
      baseSelect.innerHTML = BASES.map((x) =>
        `<option value="${esc(x.id)}">${esc(x.label)}</option>`).join("");

      // 地域の選択肢は、その地区の地点から範囲を作れるものだけ出す。
      // 地点が1件も無い地区（八潮）は、寄せる先を決められないので選べなくする。
      // 推測した座標でそれらしく動かすと、根拠の無い位置を見せることになる。
      const areaDefs = (META.areas || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
      const placesByArea = new Map();
      PLACES.forEach((place) => {
        (place.areas || []).forEach((areaId) => {
          if (!placesByArea.has(areaId)) placesByArea.set(areaId, []);
          placesByArea.get(areaId).push(place);
        });
      });
      areaSelect.innerHTML = '<option value="">区全体</option>' + areaDefs.map((area) => {
        const count = (placesByArea.get(area.id) || []).length;
        if (area.id === "ward" || area.id === "unknown") return "";
        return count
          ? `<option value="${esc(area.id)}">${esc(area.label)}</option>`
          : `<option value="${esc(area.id)}" disabled>${esc(area.label)}（地点の収録なし）</option>`;
      }).join("");

      let map = null;
      let baseLayer = null;
      let eraLayer = null;
      const placeLayer = L.layerGroup();

      function tileUrl(id, ext) {
        return `${GSI}/${id}/{z}/{x}/{y}.${ext}`;
      }

      function buildBase(id) {
        const found = BASES.find((x) => x.id === id) || BASES[0];
        if (found.id === "osm") {
          return L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19, attribution: found.credit
          });
        }
        return L.tileLayer(tileUrl(found.id, found.ext), {
          maxZoom: 19, maxNativeZoom: found.maxNativeZoom, attribution: found.credit
        });
      }

      function currentEra() {
        return ERAS.find((x) => x.id === eraSelect.value) || ERAS[0];
      }

      function applyOpacity() {
        const value = Number(opacityInput.value);
        opacityValue.textContent = `${value}%`;
        if (eraLayer) eraLayer.setOpacity(value / 100);
      }

      function setEra() {
        const era = currentEra();
        if (eraLayer) map.removeLayer(eraLayer);
        eraLayer = L.tileLayer(tileUrl(era.id, era.ext), {
          maxZoom: 19,
          maxNativeZoom: era.maxNativeZoom,
          opacity: Number(opacityInput.value) / 100,
          attribution: GSI_CREDIT
        });
        eraLayer.addTo(map);
        // 重ねた写真が、史跡のピンより下に来るようにする
        if (eraLayer.bringToFront) eraLayer.bringToFront();
        document.getElementById("era-note").innerHTML =
          `<strong>${esc(era.label)}</strong>${era.note ? "　" + esc(era.note) : ""}`;
        captionBox.innerHTML =
          `重ねている写真：${esc(era.label)}（出典：${GSI_CREDIT}）。下に敷いている地図の出典は地図の右下に表示しています。`;
      }

      function setBase() {
        if (baseLayer) map.removeLayer(baseLayer);
        baseLayer = buildBase(baseSelect.value);
        baseLayer.addTo(map);
        if (baseLayer.bringToBack) baseLayer.bringToBack();
      }

      function drawPlaces() {
        placeLayer.clearLayers();
        if (!showPlaces.checked) {
          map.removeLayer(placeLayer);
          return;
        }
        // 「表示する地域」で選んだ地区に絞る。地図の寄せ先だけを変えて
        // ピンは全域に出したままだと、何を見せられているのか分からなくなる。
        const areaId = areaSelect.value;
        const shown = areaId ? (placesByArea.get(areaId) || []) : PLACES;

        // 同じ座標の地点はまとめて1本のピンにする（歴史マップと同じ考え方）。
        const spots = new Map();
        shown.forEach((place) => {
          const key = `${place.lat.toFixed(6)},${place.lng.toFixed(6)}`;
          if (!spots.has(key)) spots.set(key, []);
          spots.get(key).push(place);
        });
        spots.forEach((group) => {
          const first = group[0];
          const category = (first.categories || [])[0] || "site";
          const letter = PIN_LETTERS[category] || "地";
          const marker = L.marker([first.lat, first.lng], {
            icon: L.divIcon({
              className: "",
              html: `<span class="pin pin--${category}">${letter}</span>`,
              iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -12]
            }),
            alt: group.map((x) => x.name).join("、")
          });
          marker.bindPopup(group.map((place) => `
            <h3>${esc(place.name)}</h3>
            <p>${esc(place.address)}</p>
            <a href="rekishi-map.html?place=${encodeURIComponent(place.id)}">歴史マップで見る</a>
          `).join("<hr />"));
          marker.addTo(placeLayer);
        });
        placeLayer.addTo(map);
      }

      function moveToArea() {
        const areaId = areaSelect.value;
        // 重ねているピンも同じ地区に合わせる
        drawPlaces();
        if (!areaId) {
          map.setView([35.6095, 139.7305], 13);
          return;
        }
        const places = placesByArea.get(areaId) || [];
        if (!places.length) return;
        map.fitBounds(places.map((x) => [x.lat, x.lng]), { padding: [40, 40], maxZoom: 16 });
      }

      try {
        map = L.map(mapRoot, { scrollWheelZoom: false }).setView([35.6095, 139.7305], 13);
        setBase();
        setEra();
        applyOpacity();
      } catch (error) {
        fail(`地図を表示できませんでした（${error && error.message ? error.message : error}）。`);
        return;
      }

      eraSelect.addEventListener("change", setEra);
      baseSelect.addEventListener("change", setBase);
      areaSelect.addEventListener("change", moveToArea);
      opacityInput.addEventListener("input", applyOpacity);
      showPlaces.addEventListener("change", drawPlaces);
      document.getElementById("controls").addEventListener("submit", (event) => event.preventDefault());

      document.getElementById("footer-root").textContent =
        `品川区議会DB — ${META.disclaimer || ""}`;
    })();
  </script>
</body>
</html>
