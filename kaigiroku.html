<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0017c1" />
  <title>会議録を見る | 品川区議会DB</title>
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="site-base.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <link rel="stylesheet" href="site-controls.css" />
  <link rel="stylesheet" href="site-mobile.css" />
  <link rel="stylesheet" href="site-a11y.css" />
  <style>
    /* ===== 基調カラー：深い青と生成りを使った、公文書・資料庫を思わせる配色 ===== */
    /* 配色はサイト共通の site-theme.css（デジタル庁デザインシステム準拠）で
       一元管理している。ここで :root を再定義すると上書きしてしまうので置かない */

    /* ===== ヒーロー ===== */
    .disclaimer {
      margin-top: 24px; max-width: none; padding: 14px 16px;
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); font-size: calc(clamp(11px, 1.25vw, 14px) * var(--fs)); line-height: 1.7;
      white-space: nowrap;
    }
    /* 狭い画面では1行に収まらないため折り返す */
    @media (max-width: 860px) {
      .disclaimer { white-space: normal; }
    }

    /* ===== 統計カード（定例会ごとの会期・議案数） ===== */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 28px; }
    .stats--section { margin: 0 0 24px; }
    .stat { border: 1px solid var(--c-border); border-top: 3px solid var(--c-main); border-radius: 3px; background: var(--c-card); padding: 16px; }
    .stat strong { display: block; color: var(--c-main); font-size: calc(28px * var(--fs)); line-height: 1.1; }
    .stat span { color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); font-weight: 700; }

    /* ===== セクション共通 ===== */
    h2 { margin: 0 0 20px; font-size: calc(24px * var(--fs)); }
    h2.sub { margin-top: 36px; }
    h3.group-title { margin: 32px 0 12px; }
    .section-lead { max-width: 760px; margin: -8px 0 24px; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.8; }

    /* ===== リンクピル（種類別に色分け） ===== */
    .pill {
      display: inline-flex; align-items: center; margin: 14px 6px 0 0;
      border: 1px solid var(--c-border); border-radius: 3px;
      background: var(--c-card); padding: 6px 12px;
      color: var(--c-main-dark); font-size: calc(13px * var(--fs)); font-weight: 800;
    }
    .pill--video { border-color: var(--c-video-border); background: var(--c-video-bg); color: var(--c-video-text); }
    .pill--minutes { border-color: var(--c-minutes-border); background: var(--c-minutes-bg); color: var(--c-minutes-text); }

    /* ===== タグ ===== */
    .tag {
      display: inline-flex; margin: 0 8px 12px 0; border-radius: 3px;
      background: var(--c-main-pale); padding: 4px 9px;
      color: var(--c-main-dark); font-size: calc(12px * var(--fs)); font-weight: 800;
    }
    .tag--result { background: var(--c-result-bg); color: var(--c-result-text); }
    .chip {
      display: inline-flex; margin-bottom: 10px; border: 1px solid var(--c-border); border-radius: 3px;
      background: var(--c-surface-sub); padding: 3px 9px; color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); font-weight: 800;
    }

    /* ===== 年切り替え ===== */
    .year-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 20px; }
    .year-row label { color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); font-weight: 800; white-space: nowrap; }
    #year-select {
      /* 16px未満だとiOSがフォーカス時に画面を自動ズームするため16pxにする */
      width: min(100%, 320px); border: 1px solid var(--c-border); border-radius: 3px;
      background: var(--c-card); padding: 10px 12px; color: var(--c-ink); font-size: calc(16px * var(--fs)); font-weight: 800;
    }
    .year-summary {
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); padding: 18px; margin-bottom: 18px;
    }
    .year-summary h3 { margin: 0 0 8px; font-size: calc(18px * var(--fs)); }
    .year-summary p { margin: 0; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.8; }

    /* ===== 会議カード ===== */
    .meeting-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
    .meeting-card { border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-card); padding: 18px; }
    .meeting-card h3 { margin: 0 0 8px; font-size: calc(17px * var(--fs)); line-height: 1.45; }
    .meeting-card p { margin: 0; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.75; }

    /* ===== 会議ごとの折りたたみ ===== */
    .accordion-controls {
      position: sticky; top: 0; z-index: 20;
      border-top: 1px solid var(--c-border); border-bottom: 1px solid var(--c-border);
      background: rgba(242, 242, 242, 0.94); padding: 8px 0;
      box-shadow: 0 2px 5px rgba(26, 26, 26, 0.1);
      backdrop-filter: blur(8px);
    }
    .accordion-controls__inner { display: flex; align-items: center; gap: 8px; }
    .accordion-controls__label { margin-right: auto; font-size: calc(14px * var(--fs)); font-weight: 800; }
    .accordion-controls__status { color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); font-weight: 700; }
    .accordion-button {
      min-height: 40px; border: 1px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); padding: 8px 14px; color: var(--c-main-dark);
      font: inherit; font-size: calc(13px * var(--fs)); font-weight: 800; cursor: pointer;
    }
    .accordion-button:hover { background: var(--c-main-pale); }
    /* フォーカスリングは site-theme.css で全ページ共通に定義している */
    .accordion-button:disabled { opacity: 0.45; cursor: default; }
    .accordion-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: 24px 0 40px; }
    .meeting-accordion {
      overflow: clip; border: 1px solid var(--c-border); border-radius: 4px;
      background: var(--c-card); scroll-margin-top: 76px;
    }
    .meeting-accordion[open] { box-shadow: 0 3px 10px rgba(26, 26, 26, 0.08); }
    .meeting-accordion > summary {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center;
      min-height: 88px; padding: 18px 20px; cursor: pointer; list-style: none;
    }
    .meeting-accordion > summary::-webkit-details-marker { display: none; }
    .meeting-accordion > summary:hover { background: var(--c-main-pale); }
    .meeting-accordion[open] > summary {
      border-bottom: 1px solid var(--c-border); background: var(--c-main-pale);
    }
    .meeting-accordion__heading { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .meeting-accordion__heading .chip { margin: 0; }
    .meeting-accordion__title { font-size: calc(21px * var(--fs)); font-weight: 800; line-height: 1.35; }
    .meeting-accordion__summary {
      grid-column: 1 / -1; margin: 2px 0 0; color: var(--c-ink-soft);
      font-size: calc(14px * var(--fs)); line-height: 1.7;
    }
    .meeting-accordion__counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .meeting-accordion__count {
      border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-surface-sub); padding: 3px 9px;
      color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); font-weight: 800;
    }
    .meeting-accordion__icon {
      display: inline-grid; place-items: center; width: 36px; height: 36px;
      border-radius: 3px; background: var(--c-main); color: #fff;
      font-size: calc(22px * var(--fs)); font-weight: 800; line-height: 1;
    }
    .meeting-accordion__icon::before { content: "+"; }
    .meeting-accordion[open] .meeting-accordion__icon::before { content: "−"; }
    .meeting-accordion__content section { padding: 32px 0 40px; }

    /* ===== タイムライン ===== */
    .timeline { display: grid; gap: 12px; }
    .timeline-item {
      display: grid; grid-template-columns: 120px 1fr; gap: 16px;
      border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); padding: 16px;
    }
    .timeline-item time { color: var(--c-main); font-weight: 800; }
    .timeline-item p { margin: 6px 0 0; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.75; }

    /* ===== カードグリッド（議案・質問） ===== */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card-grid.pushed { margin-top: 20px; }
    .card { border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-card); padding: 20px; }
    .card h3 { margin: 0 0 10px; font-size: calc(18px * var(--fs)); line-height: 1.5; }
    .card p { margin: 0; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.8; }
    .card ul { margin: 0; padding-left: 20px; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.8; }
    .card.q { padding: 0; overflow: clip; }
    .card.q > summary { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 14px 16px; cursor: pointer; list-style: none; }
    .card.q > summary::-webkit-details-marker { display: none; }
    .card.q > summary:hover, .card.q[open] > summary { background: var(--c-main-pale); }
    .card.q > summary h3 { flex: 1; margin: 0; font-size: calc(16px * var(--fs)); }
    .q__count { color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); font-weight: 800; white-space: nowrap; }
    .q__icon { color: var(--c-main); font-size: calc(20px * var(--fs)); font-weight: 900; }
    .q__icon::before { content: "+"; }
    .card.q[open] .q__icon::before { content: "−"; }
    .q__content { border-top: 1px solid var(--c-border); padding: 18px 20px 20px; }
    .question-card-grid--summaries { grid-template-columns: 1fr; }
    .q__topics-label {
      margin: 0 0 4px !important; color: var(--c-ink) !important;
      font-size: calc(13px * var(--fs)) !important; font-weight: 800;
    }
    .qa-summaries {
      display: grid; gap: 12px; margin-top: 20px; padding-top: 18px;
      border-top: 1px solid var(--c-border);
    }
    .qa-summaries > h4 { margin: 0; font-size: calc(15px * var(--fs)); }
    .qa-summary {
      border-left: 4px solid var(--c-main); border-radius: 2px;
      background: var(--c-surface-sub); padding: 14px 16px;
    }
    .qa-summary h5 { margin: 0 0 10px; font-size: calc(15px * var(--fs)); line-height: 1.55; }
    .qa-summary dl { display: grid; grid-template-columns: 5em 1fr; gap: 8px 12px; margin: 0; }
    .qa-summary dt { color: var(--c-main-dark); font-size: calc(13px * var(--fs)); font-weight: 800; }
    .qa-summary dd { margin: 0; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.8; }
    .qa-summary-note { margin-top: 14px !important; }
    .video-connection { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--c-border); }

    /* ===== 委員会の質疑・答弁 ===== */
    .committee-session {
      border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-card); overflow: clip;
    }
    .committee-session > summary, .committee-topic > summary, .committee-fulltext > summary {
      display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 14px 16px;
      cursor: pointer; list-style: none;
    }
    .committee-session > summary::-webkit-details-marker, .committee-topic > summary::-webkit-details-marker,
    .committee-fulltext > summary::-webkit-details-marker { display: none; }
    .committee-session > summary:hover, .committee-session[open] > summary,
    .committee-topic > summary:hover, .committee-topic[open] > summary,
    .committee-fulltext > summary:hover, .committee-fulltext[open] > summary { background: var(--c-main-pale); }
    .committee-session__summary-main, .committee-topic__summary-main { flex: 1; min-width: 0; }
    .committee-session__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .committee-session__head .tag { margin: 0; }
    .committee-session h3 { width: 100%; margin: 4px 0 0; font-size: calc(18px * var(--fs)); }
    .committee-session__meta { margin: 0 0 12px; color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); font-weight: 700; }
    .committee-session__overview { margin: 7px 0 0; color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); line-height: 1.65; }
    .committee-session__count, .committee-topic__count { color: var(--c-main-dark); font-size: calc(12px * var(--fs)); font-weight: 900; white-space: nowrap; }
    .committee-toggle-icon { color: var(--c-main); font-size: calc(22px * var(--fs)); font-weight: 900; }
    .committee-toggle-icon::before { content: "+"; }
    details[open] > summary .committee-toggle-icon::before { content: "−"; }
    .committee-session__content { border-top: 1px solid var(--c-border); padding: 18px; }
    .committee-topics { display: grid; gap: 12px; }
    /* 会議録の全文には、議題の区切りに使う罫線（─の連続）など折り返せない文字列が
       入っている。グリッドの子は既定が min-width:auto なので、そのままでは列が
       その最小幅まで広がり、狭い画面で横にはみ出す。 */
    .committee-topics > *, .committee-voices > * { min-width: 0; }
    .committee-topic { border: 1px solid var(--c-rule); border-radius: 3px; background: #fff; overflow: clip; }
    .committee-topic h4 { margin: 0; color: var(--c-main-dark); font-size: calc(16px * var(--fs)); }
    .committee-topic__agenda { margin: 0 0 12px; color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); font-weight: 700; }
    .committee-topic__content { border-top: 1px solid var(--c-rule); padding: 14px; }
    .committee-exchanges { display: grid; gap: 12px; }
    .committee-exchange { border-left: 4px solid var(--c-main); border-radius: 2px; background: var(--c-surface-sub); padding: 14px 16px; }
    .committee-exchange__head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .committee-exchange__head h5 { margin: 0; font-size: calc(15px * var(--fs)); }
    .committee-exchange__speaker { color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); font-weight: 700; }
    .committee-exchange__kind { border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-card); padding: 2px 7px; color: var(--c-main-dark); font-size: calc(11px * var(--fs)); font-weight: 800; }
    .committee-exchange dl { display: grid; grid-template-columns: 8em 1fr; gap: 8px 12px; margin: 0; }
    .committee-exchange dt { color: var(--c-main-dark); font-size: calc(13px * var(--fs)); font-weight: 800; }
    .committee-exchange dd { margin: 0; color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); line-height: 1.8; }
    .committee-exchange__source { margin: 10px 0 0; text-align: right; font-size: calc(12px * var(--fs)); }
    .committee-exchange__source a { color: var(--c-main-dark); font-weight: 800; }
    .committee-session__links { margin-top: 18px; }

    /* ===== 会議録全文（開いたときだけ data/minutes/ から読み込む） ===== */
    .committee-fulltext { border: 1px solid var(--c-rule); border-radius: 3px; background: #fff; overflow: clip; }
    .committee-fulltext h4 { margin: 0; color: var(--c-main-dark); font-size: calc(16px * var(--fs)); }
    .committee-fulltext__content { border-top: 1px solid var(--c-rule); padding: 14px; }
    .committee-fulltext__source {
      margin: 0 0 14px; padding: 10px 12px;
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); color: var(--c-ink-soft); font-size: calc(12px * var(--fs)); line-height: 1.7;
    }
    .committee-fulltext__state { margin: 0; color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); }
    .committee-voices { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
    .committee-voice { border-left: 3px solid var(--c-rule); padding: 0 0 0 12px; }
    .committee-voice--member { border-left-color: var(--c-main); }
    .committee-voice__speaker { margin: 0 0 4px; color: var(--c-main-dark); font-size: calc(13px * var(--fs)); font-weight: 800; }
    .committee-voice__no { margin-right: 6px; color: var(--c-ink-soft); font-size: calc(11px * var(--fs)); font-weight: 700; }
    /* 公式会議録の改行ごとに1段落。長い答弁でも読める間隔にする */
    .committee-voice__text { margin: 0; font-size: calc(14px * var(--fs)); line-height: 1.9; overflow-wrap: anywhere; }
    .committee-voice__text + .committee-voice__text { margin-top: 8px; }
    .committee-voice:target { background: var(--c-highlight); }
    .committee-voice:target .committee-voice__speaker { text-decoration: underline; }

    .committee-pending { border: 1px dashed var(--c-border); border-radius: 3px; background: var(--c-surface-sub); padding: 14px 16px; }
    .committee-pending strong { display: block; margin-bottom: 5px; }
    .committee-pending p { margin: 0; color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); }

    /* ===== 一覧行（請願・会議録） ===== */
    .rows { display: grid; gap: 10px; }
    .rows .row {
      display: grid; grid-template-columns: minmax(150px, 210px) 1fr auto; gap: 12px; align-items: start;
      border: 1px solid var(--c-border); border-radius: 3px; background: var(--c-card);
      padding: 14px; font-size: calc(14px * var(--fs));
    }
    .row .key { color: var(--c-main-dark); font-weight: 800; }
    .row .result {
      border-radius: 3px; background: var(--c-result-bg); color: var(--c-result-text);
      padding: 4px 10px; font-size: calc(12px * var(--fs)); font-weight: 800; white-space: nowrap;
    }
    .row .pill { margin-top: 0; }

    /* ===== 注意書き・補足 ===== */
    .notice {
      margin: 0 0 20px; padding: 14px 16px;
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); font-size: calc(14px * var(--fs)); line-height: 1.7;
    }

    /* ===== 参照元・フッター ===== */
    .sources { border-top: 1px solid var(--c-border); background: var(--c-card); }
    .sources ul { margin: 0; padding-left: 20px; line-height: 1.9; }

    /* ===== エラー表示 ===== */

    /* アンカーリンクで飛んだとき固定操作バーの下に見出しが収まるよう余白を取る */
    section[id], h2[id], h3[id], .card.q[id], .record-section[id],
    .committee-session[id], .committee-topic[id], .committee-exchange[id] { scroll-margin-top: 76px; }

    /* ===== 件数の多い資料種別をまとめる内側の折りたたみ ===== */
    .record-section { margin-top: 30px; border: 1px solid var(--c-border); border-top: 3px solid var(--c-main); border-radius: 3px; background: var(--c-surface-sub); }
    .record-section > summary { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 13px 16px; cursor: pointer; list-style: none; }
    .record-section > summary::-webkit-details-marker { display: none; }
    .record-section > summary:hover, .record-section[open] > summary { background: var(--c-main-pale); }
    .record-section__title { flex: 1; min-width: 0; }
    .record-section__title strong { display: block; color: var(--c-main-dark); font-size: calc(18px * var(--fs)); }
    .record-section__title span { display: block; margin-top: 3px; color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); line-height: 1.55; }
    .record-section__count { color: var(--c-main-dark); font-size: calc(13px * var(--fs)); font-weight: 900; white-space: nowrap; }
    .record-section__icon { color: var(--c-main); font-size: calc(22px * var(--fs)); font-weight: 900; }
    .record-section__icon::before { content: "+"; }
    .record-section[open] .record-section__icon::before { content: "−"; }
    .record-section__content { border-top: 1px solid var(--c-border); padding: 18px; }

    /* ===== スマホ向け調整 ===== */
    @media (max-width: 640px) {
      .timeline-item, .rows .row { grid-template-columns: 1fr; gap: 8px; }
      /* 議決結果タグが横幅いっぱいに伸びないようにする */
      .row .result { justify-self: start; }

      /* 余白を詰めて1画面の情報量を確保する */
      .disclaimer { font-size: calc(13px * var(--fs)); white-space: normal; }
      h2 { font-size: calc(21px * var(--fs)); }
      .card { padding: 16px; }
      .card.q { padding: 0; }
      .meeting-card { padding: 16px; }
      .qa-summary { padding: 13px 14px; }
      .qa-summary dl { grid-template-columns: 1fr; gap: 4px; }
      .qa-summary dd + dt { margin-top: 6px; }
      .committee-session > summary, .committee-topic > summary,
      .committee-fulltext > summary { min-height: 72px; padding: 13px; }
      /* 会議録の全文は「会議 → 資料種別 → 会議 → 全文」と入れ子の底にあるため、
         狭い画面では枠と余白で幅の4割が消えて1行15文字ほどになる。外側から順に
         余白を詰めて行長を確保する（縦の余白・背景色・左罫は残す）。 */
      .meeting-accordion__content .container { width: calc(100% - 16px); }
      .committee-session__content { padding: 12px 0; }
      .committee-fulltext__content { padding: 14px 6px; }
      .committee-session h3 { font-size: calc(16px * var(--fs)); }
      .committee-session__count, .committee-topic__count { white-space: normal; text-align: right; }
      .committee-exchange { padding: 13px 14px; }
      .committee-exchange dl { grid-template-columns: 1fr; gap: 4px; }
      .committee-exchange dd + dt { margin-top: 6px; }

      .accordion-controls__inner { flex-wrap: nowrap; gap: 6px; }
      .accordion-controls__label { display: none; }
      .accordion-controls__status { margin-right: auto; }
      .accordion-button { min-height: 44px; padding: 8px 9px; font-size: calc(12px * var(--fs)); }
      .accordion-list { padding-top: 16px; }
      .meeting-accordion > summary { grid-template-columns: minmax(0, 1fr) auto; min-height: 96px; padding: 16px; }
      .meeting-accordion__title { font-size: calc(18px * var(--fs)); }
      .meeting-accordion__summary { font-size: calc(13px * var(--fs)); }
      .record-section { margin-top: 22px; }
      .record-section > summary { min-height: 64px; padding: 12px; }
      .record-section__title strong { font-size: calc(16px * var(--fs)); }
      .record-section__content { padding: 12px 6px; }
      .q__content { padding: 16px; }

      /* 指でタップしやすいようリンクピルを大きくする */
      .pill { padding: 9px 14px; font-size: calc(14px * var(--fs)); }
    }

    @media print {
      .accordion-controls { display: none; }
      .meeting-accordion { break-inside: avoid; }
      .meeting-accordion > summary { border-bottom: 1px solid var(--c-border); }
      .meeting-accordion > :not(summary) { display: block !important; }
      .record-section > :not(summary), .card.q > :not(summary) { display: block !important; }
    }
  </style>
</head>
<body>
  <main>
    <!-- ヒーロー：サイト名・説明・免責・統計（JSで描画） -->
    <div class="hero">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">← 品川区議会DB トップへ</a></p>
        <div id="hero-root"></div>
        <nav data-site-nav></nav>
      </div>
    </div>

    <!-- 年切り替え＋年間の流れ -->
    <section>
      <div class="container">
        <h2>年別に見る</h2>
        <div class="year-row">
          <label for="year-select">表示する年</label>
          <select id="year-select" aria-label="表示する年を選択"></select>
        </div>
        <div id="year-overview"></div>
      </div>
    </section>

    <!-- 全会議の開閉操作（スクロール中も上部に固定） -->
    <div class="accordion-controls" id="accordion-controls" hidden>
      <div class="container accordion-controls__inner">
        <span class="accordion-controls__label">会議の詳細</span>
        <span class="accordion-controls__status" id="accordion-status" aria-live="polite"></span>
        <button class="accordion-button" id="open-all" type="button">すべて開く</button>
        <button class="accordion-button" id="close-all" type="button">すべて閉じる</button>
      </div>
    </div>

    <!-- 各会議の詳細・議案・請願陳情・質問・会議録（JSで描画） -->
    <div id="detail-root"></div>

    <!-- 参照元 -->
    <section class="sources">
      <div class="container" id="sources-root"></div>
    </section>
  </main>

  <footer>
    <div class="container" id="footer-root"></div>
  </footer>

  <!-- データ読み込み（script形式なので file:// のダブルクリックでも動く） -->
  <script src="data/site.js"></script>
  <script src="data/r08.js"></script>
  <script src="data/r08-complete.js"></script>
  <script src="data/r08-committees.js"></script>
  <script src="data/r08-committees-part-01.js"></script>
  <script src="data/r08-committees-part-02.js"></script>
  <script src="data/r08-committees-part-03.js"></script>
  <script src="data/r08-committees-part-04.js"></script>
  <script src="data/r08-committees-part-05.js"></script>
  <script src="data/r08-committees-part-06.js"></script>
  <script src="data/r08-committees-part-07.js"></script>

  <script>
    "use strict";

    // アンカー付きで開かれたときは、位置合わせをこちらで持つ。全文の中の発言は
    // 読み込むまでDOMに無く、ブラウザは移動先を見つけられないまま前回の位置を
    // 復元する。こちらが合わせたあとに復元が来ると、別の場所へ飛ばされる。
    // 復元より先に止める必要があるので、初期化を待たずここで切る。
    if (location.hash && "scrollRestoration" in history) history.scrollRestoration = "manual";

    /* ---------- ユーティリティ ---------- */

    // HTMLエスケープ（データ由来の文字列は必ずこれを通す）
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // 年データを取得する。data/*.js が window.SHINAGAWA_DB に登録する方式なので、
    // ローカルでダブルクリックして開いても（file://）動作する
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`${src} の読み込みに失敗しました`));
        document.head.appendChild(s);
      });
    }

    async function loadYearData(meta) {
      const db = window.SHINAGAWA_DB;
      if (!db.years[meta.id]) await loadScript(meta.file);
      const year = db.years[meta.id];
      if (!year) throw new Error(`${meta.file} に ${meta.id} のデータが見つかりません`);

      // 全件表示用の補足データがある年は、基礎データの後に一度だけ読み込む。
      db.loadedSupplements = db.loadedSupplements || {};
      if (meta.supplement && !db.loadedSupplements[meta.supplement]) {
        await loadScript(meta.supplement);
        db.loadedSupplements[meta.supplement] = true;
      }

      // 本会議の全文の目次。質問者から原文への入口もここで足すので、
      // year.questions を差し替える -complete.js より後に読み込む。
      db.loadedPlenaryMinutes = db.loadedPlenaryMinutes || {};
      if (meta.plenaryMinutes && !db.loadedPlenaryMinutes[meta.id]) {
        await loadScript(`data/${meta.id}-plenary-minutes.js`);
        db.loadedPlenaryMinutes[meta.id] = true;
      }

      // 委員会データは容量が大きいため、対象年を選んだときだけ分割ファイルを読み込む。
      db.loadedCommitteeYears = db.loadedCommitteeYears || {};
      if (meta.committees && !db.loadedCommitteeYears[meta.id]) {
        await loadScript(`data/${meta.id}-committees.js`);
        for (const part of year.committeeDataParts || []) {
          await loadScript(`data/${part}`);
        }
        db.loadedCommitteeYears[meta.id] = true;
      }
      return year;
    }

    /* ---------- 部品の描画 ---------- */

    // リンクの種類ごとの色クラス（official=青 / video=赤 / minutes・minutesDraft=緑）
    const PILL_CLASS = {
      official: "pill",
      video: "pill pill--video",
      minutes: "pill pill--minutes",
      minutesDraft: "pill pill--minutes"
    };

    // リンクピル1個分のHTML（外部サイトのみ新しいタブで開く。#アンカーやサイト内ページはそのまま遷移）
    function pillHtml(link) {
      const cls = PILL_CLASS[link.type] || "pill";
      const isExternal = /^https?:/.test(String(link.url));
      const target = isExternal ? ' target="_blank" rel="noopener"' : "";
      return `<a class="${cls}" href="${esc(link.url)}"${target}>${esc(link.label)}</a>`;
    }

    // リンク一覧のHTML。校正原稿PDFが含まれる場合は案内文を自動で添える
    function pillsHtml(links, site) {
      if (!links || links.length === 0) return "";
      let html = links.map(pillHtml).join("\n");
      if (links.some((l) => l.type === "minutesDraft")) {
        html += `<p class="fine-print">※${esc(site.draftPdfNote)}
          <a href="https://kaigiroku.city.shinagawa.tokyo.jp/index.php/" target="_blank" rel="noopener">会議録検索システムを開く</a></p>`;
      }
      return html;
    }

    // タグ列（分野タグ＋議決結果タグ）のHTML
    function tagsHtml(tags, result) {
      const t = (tags || []).map((tag) => `<span class="tag">${esc(tag)}</span>`).join("");
      const r = result ? `<span class="tag tag--result">${esc(result)}</span>` : "";
      return t + r;
    }

    /* ---------- セクションの描画 ---------- */

    // ヒーロー（サイト名・説明・免責・入口リンク）
    // ※会期・議案数などの統計は年間で共通ではないため、各定例会のセクションに表示する
    function renderHero(site) {
      document.getElementById("hero-root").innerHTML = `
        <h1>${esc(site.siteName)}</h1>
        <p class="lead">${esc(site.lead)}</p>
        <div class="disclaimer">${esc(site.disclaimer)}</div>`;
    }

    // 統計カード（会期・議案数など。meeting.stats を持つ会議のセクション冒頭に出す）
    function statsHtml(stats) {
      if (!stats || stats.length === 0) return "";
      const cells = stats.map((s) =>
        `<div class="stat"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span></div>`
      ).join("");
      return `<div class="stats stats--section">${cells}</div>`;
    }

    // 年セレクトボックス
    function renderYearSelect(site, currentId) {
      const sel = document.getElementById("year-select");
      sel.innerHTML = (site.years || []).map((y) =>
        `<option value="${esc(y.id)}"${y.available ? "" : " disabled"}${y.id === currentId ? " selected" : ""}>${esc(y.label)}</option>`
      ).join("");
    }

    // 会議に紐づく議案・請願・質問をまとめて取得する
    function relatedItems(meeting, year) {
      return {
        bills: (year.bills || []).filter((b) => b.meetingId === meeting.id),
        petitions: (year.petitions || []).filter((p) => p.meetingId === meeting.id),
        questions: (year.questions || []).filter((q) => q.meetingId === meeting.id),
        committeeSessions: (year.committeeSessions || []).filter((session) => session.meetingId === meeting.id),
        committeePending: (year.committeePending || []).filter((session) => session.meetingId === meeting.id)
      };
    }

    // タイムラインまたは関連情報を持つ会議だけ詳細を表示する
    function hasMeetingDetails(meeting, year) {
      const related = relatedItems(meeting, year);
      return (meeting.events && meeting.events.length > 0) ||
        related.bills.length > 0 || related.petitions.length > 0 || related.questions.length > 0 ||
        related.committeeSessions.length > 0 || related.committeePending.length > 0;
    }

    // 折りたたみ見出しに表示する件数
    function meetingCountsHtml(meeting, related) {
      const counts = [];
      if (meeting.events && meeting.events.length > 0) counts.push(`日程 ${meeting.events.length}件`);
      if (related.bills.length > 0) counts.push(`議案 ${related.bills.length}件`);
      if (related.petitions.length > 0) counts.push(`請願・陳情 ${related.petitions.length}件`);
      if (related.questions.length > 0) counts.push(`質問者 ${related.questions.length}名`);
      // 委員会は全文を載せるので、会議の数で示す（抜粋の件数は画面に出ない）。
      if (related.committeeSessions.length > 0) counts.push(`委員会 ${related.committeeSessions.length}会議`);
      if (related.committeePending.length > 0) counts.push(`会議録待ち ${related.committeePending.length}会議`);
      if (counts.length === 0) return "";
      return `<span class="meeting-accordion__counts">${counts.map((count) =>
        `<span class="meeting-accordion__count">${esc(count)}</span>`).join("")}</span>`;
    }

    // 令和7年以前は、委員会データを後から読み込むため、そのままでは委員会カードが
    // 定例会・臨時会の後ろにまとまってしまう。令和8年と同じ考え方で、開催月ごとに
    // 「月例委員会 → 本会議 → 予算・決算特別委員会」の順に並べる。
    function orderedMeetings(year) {
      const meetings = year.meetings || [];
      if (year.id === "r08") return meetings;

      const firstMonth = (meeting) => {
        const match = String(meeting.monthLabel || "").match(/\d{1,2}/);
        return match ? Number(match[0]) : 99;
      };
      const meetingKindOrder = (meeting) => {
        const id = String(meeting.id || "");
        const name = String(meeting.name || "");
        if (/月の委員会/.test(name) || /-cm\d+$/.test(id)) return 0;
        if (/予算特別委員会|決算特別委員会/.test(name) || /-c-(?:budget|settlement)$/.test(id)) return 2;
        return 1;
      };

      return meetings
        .map((meeting, index) => ({ meeting, index }))
        .sort((a, b) =>
          firstMonth(a.meeting) - firstMonth(b.meeting) ||
          meetingKindOrder(a.meeting) - meetingKindOrder(b.meeting) ||
          a.index - b.index)
        .map(({ meeting }) => meeting);
    }

    // 年の概要＋会議カード一覧
    function renderYearOverview(year, site) {
      const cards = orderedMeetings(year).map((m) => `
        <article class="meeting-card">
          <span class="chip">${esc(m.monthLabel)}</span>
          <h3>${esc(m.name)}</h3>
          <p>${esc(m.summary)}</p>
          ${pillsHtml(m.links, site)}
          <a class="pill" href="kaigi.html?year=${esc(year.id)}&meeting=${esc(m.id)}">会議を1ページで見る</a>
          ${hasMeetingDetails(m, year) ? `<a class="pill" href="#meeting-${esc(m.id)}">この会議の詳細へ</a>` : ""}
        </article>`).join("");
      document.getElementById("year-overview").innerHTML = `
        <div class="year-summary">
          <h3>${esc(year.yearSummary.title)}</h3>
          <p>${esc(year.yearSummary.text)}</p>
        </div>
        <div class="meeting-grid">${cards}</div>`;
    }

    // タイムライン（日付ごとの出来事）
    function timelineHtml(events, site) {
      const items = (events || []).map((ev) => `
        <div class="timeline-item">
          <time>${esc(ev.date)}</time>
          <div>
            <strong>${esc(ev.title)}</strong>
            <p>${esc(ev.description)}</p>
            ${pillsHtml(ev.links, site)}
            ${ev.note ? `<p class="fine-print">${esc(ev.note)}</p>` : ""}
          </div>
        </div>`).join("");
      return `<div class="timeline">${items}</div>`;
    }

    // 議案カード
    function billCardHtml(bill, site) {
      return `
        <article class="card">
          ${tagsHtml(bill.tags, bill.result)}
          <h3>${esc(bill.title)}</h3>
          <p>${esc(bill.summary)}</p>
          ${pillsHtml(bill.links, site)}
        </article>`;
    }

    // 請願・陳情ページの個別URL。受理番号（例: 令和5年 陳情第31号）から作る。
    // 番号が読み取れない行（公式ページの取り込みで列がずれた平成30年など）は件名で検索させる。
    function petitionDetailUrl(petition) {
      const number = String(petition.number || "")
        .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
        .replace(/\s+/g, "");
      const parts = /^(平成|令和)(元|\d{1,2})年(請願|陳情)第(\d{1,3})(?:-(\d{1,2}))?号$/.exec(number);
      if (!parts) {
        return petition.title ? `seigan.html?q=${encodeURIComponent(petition.title)}` : "seigan.html";
      }
      const era = parts[1] === "平成" ? "h" : "r";
      const eraYear = String(parts[2] === "元" ? 1 : Number(parts[2])).padStart(2, "0");
      const kind = parts[3] === "請願" ? "s" : "c";
      return `seigan.html#p-${era}${eraYear}-${kind}${Number(parts[4])}${parts[5] ? `-${parts[5]}` : ""}`;
    }

    // 請願・陳情の行
    function petitionRowHtml(p, site) {
      return `
        <div class="row">
          <span class="key">${esc(p.number)}</span>
          <span>${esc(p.title)}<br />
            <a class="pill" href="${esc(petitionDetailUrl(p))}">この請願・陳情の経過を見る</a>
            ${pillsHtml(p.links, site)}</span>
          <span class="result">${esc(p.result)}</span>
        </div>`;
    }

    // 件数の多い資料を、件数と説明が閉じた状態でも分かる内側の折りたたみにする
    function recordSectionHtml({ id, title, lead, countLabel, content, open = false }) {
      return `<details class="record-section" id="${esc(id)}"${open ? " open" : ""}>
        <summary>
          <span class="record-section__title">
            <strong>${esc(title)}</strong>
            ${lead ? `<span>${esc(lead)}</span>` : ""}
          </span>
          <span class="record-section__count">${esc(countLabel)}</span>
          <span class="record-section__icon" aria-hidden="true"></span>
        </summary>
        <div class="record-section__content">${content}</div>
      </details>`;
    }

    // 質問カード（議員名・会派・テーマ）
    function questionCardHtml(q, site) {
      const topics = (q.topics || []).map((t) => `<li>${esc(t)}</li>`).join("");
      const questionVideo = (q.links || []).find((link) => link.type === "video");
      const qaSummaries = (q.qaSummaries || []).map((item) => `
        <div class="qa-summary">
          <h5>${esc(item.title)}</h5>
          <dl>
            <dt>質問の要約</dt>
            <dd>${esc(item.question)}</dd>
            <dt>答弁の要約</dt>
            <dd>${esc(item.answer)}</dd>
          </dl>
          ${questionVideo ? `<div class="video-connection">${pillHtml({
            ...questionVideo,
            label: "この質問者の公式録画で確認"
          })}</div>` : ""}
        </div>`).join("");
      return `
        <details class="card q" id="question-${esc(q.meetingId)}-${esc(q.memberId)}">
          <summary>
            <h3>${esc(q.member)}（${esc(q.party)}）</h3>
            <span class="q__count">質問 ${esc((q.topics || []).length)}項目</span>
            <span class="q__icon" aria-hidden="true"></span>
          </summary>
          <div class="q__content">
            <p class="q__topics-label">質問項目（全件）</p>
            <ul>${topics}</ul>
            ${qaSummaries ? `<div class="qa-summaries" aria-label="${esc(q.member)}議員の質問と答弁の要約">
            <h4>会議録からの要約</h4>
            ${qaSummaries}
          </div>
          <p class="fine-print qa-summary-note">※質問・答弁の要点を本サイトで要約しています。正確な発言は公式の会議録をご確認ください。${
            q.fullText ? "下の「原文を読む」から、この議員の質問の全文へ移動できます。" : ""}</p>` : ""}
            ${questionFullTextLinkHtml(q)}
            ${pillsHtml(q.links, site)}
          </div>
        </details>`;
    }

    function committeeExchangeCount(session) {
      return (session.topics || []).reduce((total, topic) => total + (topic.exchanges || []).length, 0);
    }

    /* ---------- 会議録全文 ---------- */

    // 全文は会議1件につき1ファイル。会議IDの先頭3文字が年ID（r06-20240515-19 → r06）
    // なので、対応表を持たずにパスを導ける（scripts/minutes_fulltext.py と同じ導出）。
    function minutesFile(sessionId) {
      return `data/minutes/${sessionId.slice(0, 3)}/${sessionId}.js`;
    }

    // 委員会と本会議で全文の仕組みは同じ。会議IDの末尾で見分ける
    // （本会議は r06-20240220-honkaigi、委員会は r06-20240515-19）。
    function fullTextKind(sessionId) {
      return String(sessionId).endsWith("-honkaigi") ? "plenary" : "committee";
    }

    function voiceAnchor(sessionId, voiceIndex) {
      return `${fullTextKind(sessionId)}-${sessionId}-v${String(voiceIndex).padStart(4, "0")}`;
    }

    // 全文の開閉を持つ会議を、委員会・本会議のどちらからでも引く。
    function fullTextSession(sessionId) {
      const year = activeYear || {};
      return (year.committeeSessions || []).find((item) => item.id === sessionId)
        || (year.plenaryMinutes || []).find((item) => item.id === sessionId)
        || null;
    }

    // 抜粋は原文の3割ほどで、答弁は文の途中で切れていることが多い。1手で
    // 原文へ行けるようにしておく（全文を載せる一番の目的がこれ）。
    function voiceJumpHtml(session, item) {
      if (!session.hasFullText || !item.voiceIndex) return "";
      return `<p class="committee-exchange__source">
        <a href="#${esc(voiceAnchor(session.id, item.voiceIndex))}"
           data-voice-jump="${esc(session.id)}">原文を読む（発言 ${esc(item.voiceIndex)}）</a></p>`;
    }

    // 発言本文は、公式会議録の改行を段落として持っている（scripts/minutes_fulltext.py
    // の voice_paragraphs）。4,000字を超える答弁があるので、ここで段落に戻さないと
    // 改行のない一続きになって読めない。
    function voiceTextHtml(text) {
      return String(text || "").split("\n").filter((line) => line.trim())
        .map((line) => `<p class="committee-voice__text">${esc(line)}</p>`).join("");
    }

    // 委員会は sourceMeta に、本会議は目次（plenaryMinutes）に持っている。
    // 本会議の質問者から原文へ。要約は見出しの言い換えになっているものが
    // 多いので、その議員が質問を始めた発言へ直接飛ばす
    // （位置は data/<年>-plenary-minutes.js が持っている）。
    function questionFullTextLinkHtml(question) {
      const start = question.fullText;
      if (!start || !start.sessionId || !start.voiceIndex) return "";
      return `<p class="committee-exchange__source">
        <a href="#${esc(voiceAnchor(start.sessionId, start.voiceIndex))}"
           data-voice-jump="${esc(start.sessionId)}">会議録の原文を読む（${esc(question.member)}議員の質問全文へ）</a></p>`;
    }

    function fullTextSummaryLabel(session) {
      const meta = session.sourceMeta || session;
      const parts = [];
      if (meta.voices) parts.push(`${meta.voices}発言`);
      if (meta.characters) parts.push(`約${Math.round(meta.characters / 1000)}千字`);
      return parts.join("・") || "全文";
    }

    function fullTextHtml(session, minutes) {
      // 全文にするのは正式会議録だけ（prepare_committees.py）。formal でない
      // ものは本来置かれず、CIの check_minutes_fulltext.py でも失敗する。
      // ここで分けているのは、万一入り込んだときに「正式会議録の全文です」と
      // 言い切らないための保険。
      const formal = minutes.sourceType === "formal";
      // 出典は全文そのものが持っている（委員会・本会議で同じ形）。
      const source = /^https?:/.test(String(minutes.sourceUrl)) ? minutes.sourceUrl : "";
      const voices = (minutes.voices || []).map((voice) => `
        <li class="committee-voice${voice.speaker ? " committee-voice--member" : ""}"
            id="${esc(voiceAnchor(session.id, voice.i))}">
          ${voice.speaker ? `<p class="committee-voice__speaker">
            <span class="committee-voice__no">${esc(voice.i)}</span>○${esc(voice.speaker)}</p>` : ""}
          ${voiceTextHtml(voice.text)}
        </li>`).join("");
      return `
        <p class="committee-fulltext__source">
          ${formal
            ? "品川区議会公式の<strong>正式会議録</strong>の全文です。"
            : "<strong>正式な会議録ではありません。</strong>正式版の公開後に差し替えます。"}
          発言の表記は公式の記録のとおりで、本サイトでの要約・言い換えは行っていません。
          ${source ? `出典：<a href="${esc(source)}" target="_blank" rel="noopener">公式の会議録を読む</a>` : ""}
          （${esc(minutes.fetchedAt)}取得）。正確な内容は必ず公式の会議録をご確認ください。
        </p>
        <ol class="committee-voices">${voices}</ol>`;
    }

    // 読み込み中のものを覚えておく。開閉の toggle とアンカーからの呼び出しが
    // 重なったとき、あとから来たほうが「読み込み中だから何もしない」で終わると、
    // 移動先がまだDOMに無いまま処理が進んでしまう（アンカー直打ちで実際に起きた）。
    // 同じ読み込みを待たせるため、要素ごとにPromiseを持たせる。
    const fullTextLoads = new WeakMap();

    function renderFullText(details) {
      if (!details) return Promise.resolve();
      if (fullTextLoads.has(details)) return fullTextLoads.get(details);
      const task = loadFullText(details).finally(() => {
        // 失敗したときは覚えを消して、開き直しで取り直せるようにする
        if (details.dataset.fullTextState !== "done") fullTextLoads.delete(details);
      });
      fullTextLoads.set(details, task);
      return task;
    }

    // 会議を開いた時点では読み込まない。全文の開閉を開いたときに初めて取りに行く。
    async function loadFullText(details) {
      const sessionId = details.dataset.fulltextFor;
      const box = details.querySelector("[data-fulltext]");
      if (!sessionId || !box) return;
      const session = fullTextSession(sessionId);
      if (!session) return;
      details.dataset.fullTextState = "loading";
      box.innerHTML = `<p class="committee-fulltext__state">会議録全文を読み込んでいます…</p>`;
      try {
        if (!window.SHINAGAWA_DB.minutes[sessionId]) await loadScript(minutesFile(sessionId));
        const minutes = window.SHINAGAWA_DB.minutes[sessionId];
        if (!minutes) throw new Error(`${sessionId} の全文を読み取れませんでした`);
        box.innerHTML = fullTextHtml(session, minutes);
        details.dataset.fullTextState = "done";
      } catch (err) {
        // 開き直しで取り直せるよう、状態を戻してから知らせる
        details.dataset.fullTextState = "";
        const url = session.sourceUrl
          || ((session.links || []).find((item) => /^https?:/.test(String(item.url))) || {}).url;
        box.innerHTML = `<p class="committee-fulltext__state">会議録全文を読み込めませんでした。
          もう一度開くと読み直します。${url
            ? `<a href="${esc(url)}" target="_blank" rel="noopener">公式の会議録</a>もご利用ください。`
            : ""}</p>`;
      }
    }

    // 全文を読み込んだうえで、その中の発言まで開く。抜粋からの「原文を読む」と
    // 全文内アンカーの両方から呼ぶ。委員会は会議の開閉を先に開く必要があるが、
    // 本会議の全文は資料種別の節に直接置いてあるので、それが要らない。
    async function openFullText(sessionId) {
      if (fullTextKind(sessionId) === "committee") {
        const session = document.getElementById(`committee-${sessionId}`);
        if (!session) return null;
        renderCommitteeSession(session);
        session.open = true;
      }
      const details = document.getElementById(`${fullTextKind(sessionId)}-${sessionId}-full`);
      if (!details) return null;
      details.open = true;
      await renderFullText(details);
      return details;
    }

    function fullTextDetailsHtml(session, heading = "会議録全文") {
      if (!session.hasFullText) return "";
      return `<details class="committee-fulltext" id="${esc(fullTextKind(session.id))}-${esc(session.id)}-full"
                       data-fulltext-for="${esc(session.id)}">
        <summary>
          <span class="committee-topic__summary-main"><h4>${esc(heading)}</h4></span>
          <span class="committee-topic__count">${esc(fullTextSummaryLabel(session))}</span>
          <span class="committee-toggle-icon" aria-hidden="true"></span>
        </summary>
        <div class="committee-fulltext__content" data-fulltext></div>
      </details>`;
    }

    // 本会議の全文。1日ぶんずつの開閉にする（1日6万字あるので、定例会の
    // 全日をまとめて開くと重い）。
    function plenaryFullTextHtml(days) {
      return `<div class="committee-topics">${days.map((day) =>
        fullTextDetailsHtml(day, `${day.date}${day.dayLabel ? `（${day.dayLabel}）` : ""}`)
      ).join("")}</div>
      <p class="fine-print qa-summary-note">※品川区議会公式の正式会議録をそのまま掲載しています（本サイトによる要約・言い換えはありません）。
        各質問者の「原文を読む」から、その議員が質問を始めた発言へ移動できます。</p>`;
    }

    // 見出しの説明。session.overview は抜粋の件数を述べる文なので、全文を載せる
    // 会議では中身と合わない。全文が在る会議は分量で示す。
    function committeeSessionOverview(session) {
      if (!session.hasFullText) return session.overview;
      return `${session.committee}の公式会議録を、要約せずそのまま全文で掲載しています。`;
    }

    // 初期DOMを軽くするため、会議見出しだけを先に描画し、開いた会議の中身だけを生成する。
    function committeeSessionsHtml(sessions, pending) {
      const published = sessions.map((session) => `<details class="committee-session" id="committee-${esc(session.id)}" data-session-id="${esc(session.id)}">
        <summary>
          <span class="committee-session__summary-main">
            <span class="committee-session__head">
              <span class="tag">${esc(session.status || "委員会質疑")}</span>
              <h3>${esc(session.date)} ${esc(session.committee)}</h3>
            </span>
            <span class="committee-session__overview">${esc(committeeSessionOverview(session))}</span>
          </span>
          <span class="committee-session__count">${session.hasFullText
            ? esc(fullTextSummaryLabel(session))
            : `${committeeExchangeCount(session)}件`}</span>
          <span class="committee-toggle-icon" aria-hidden="true"></span>
        </summary>
        <div class="committee-session__content" data-session-content></div>
      </details>`).join("");
      const waiting = pending.map((session) => `<article class="committee-pending" id="committee-${esc(session.id)}">
        <strong>${esc(session.date)} ${esc(session.committee)}</strong>
        <p>${esc(session.status)} — 会議録が公開されるまで掲載しません。
          ${session.officialUrl ? `<a href="${esc(session.officialUrl)}" target="_blank" rel="noopener">公式カレンダーを確認</a>` : ""}</p>
      </article>`).join("");
      return `<div class="committee-topics">${published}${waiting}</div>`;
    }

    function committeeTopicHtml(session, topic) {
      const exchanges = (topic.exchanges || []).map((item) => `
        <article class="committee-exchange" id="committee-${esc(session.id)}-${esc(item.id)}">
          <div class="committee-exchange__head">
            <h5>${esc(item.title || item.speaker)}</h5>
            ${item.title ? `<span class="committee-exchange__speaker">${esc(item.speaker)}</span>` : ""}
            <span class="committee-exchange__kind">${esc(item.kind || "質問")}</span>
          </div>
          <dl>
            <dt>質問・意見（発言の抜粋）</dt>
            <dd>${esc(item.question)}</dd>
            <dt>答弁・対応（発言の抜粋）</dt>
            <dd>${esc(item.answer)}</dd>
            ${item.respondent ? `<dt>答弁・対応者</dt><dd>${esc(item.respondent)}</dd>` : ""}
          </dl>
          ${voiceJumpHtml(session, item)}
        </article>`).join("");
      return `<details class="committee-topic" id="committee-${esc(session.id)}-${esc(topic.id)}">
        <summary>
          <span class="committee-topic__summary-main"><h4>${esc(topic.title)}</h4></span>
          <span class="committee-topic__count">${(topic.exchanges || []).length}件</span>
          <span class="committee-toggle-icon" aria-hidden="true"></span>
        </summary>
        <div class="committee-topic__content">
          ${topic.agenda ? `<p class="committee-topic__agenda">議題：${esc(topic.agenda)}</p>` : ""}
          <div class="committee-exchanges">${exchanges}</div>
        </div>
      </details>`;
    }

    let activeYear = null;
    let activeSite = null;

    function renderCommitteeSession(details) {
      if (!details || details.dataset.rendered === "true" || !activeYear) return;
      const session = (activeYear.committeeSessions || []).find((item) => item.id === details.dataset.sessionId);
      const content = details.querySelector("[data-session-content]");
      if (!session || !content) return;
      // 委員会は会議録の全文だけを載せる。議題別の抜粋は、発言の一部しか拾えず
      // 答弁が文の途中で切れるものが多いため、全文が在る会議では出さない。
      // 全文がまだ無いのは校正原稿だけなので、そこは抜粋を残す。
      content.innerHTML = `
        ${session.time ? `<p class="committee-session__meta">開催時間：${esc(session.time)}</p>` : ""}
        <div class="committee-topics">${session.hasFullText
          ? fullTextDetailsHtml(session)
          : (session.topics || []).map((topic) => committeeTopicHtml(session, topic)).join("")}</div>
        ${session.hasFullText ? "" : `<p class="fine-print qa-summary-note">※この会議はまだ正式な会議録が公開されていないため、校正原稿から質問・答弁の該当箇所を抜き出して掲載しています。発言の一部のみのため、前後の文脈は公式の会議録をご確認ください。明確な回答が記録されていない発言には、その旨を記載しています。</p>`}
        <div class="committee-session__links">${pillsHtml(session.links, activeSite)}</div>`;
      details.dataset.rendered = "true";
      setupDetailsAccessibility(content);
      // 全文が会議の中身そのものになったので、開いた時点で読み込んで表示する。
      const fullText = content.querySelector(".committee-fulltext");
      if (fullText) {
        fullText.open = true;
        renderFullText(fullText);
      }
    }

    // 会議1件分の詳細セクション（タイムライン＋関連する議案・請願・質問）
    function meetingSectionHtml(meeting, year, site) {
      const related = relatedItems(meeting, year);
      const { bills, petitions, questions, committeeSessions, committeePending } = related;

      let html = `<details class="meeting-accordion" id="meeting-${esc(meeting.id)}" data-meeting-id="${esc(meeting.id)}">
        <summary>
          <span>
            <span class="meeting-accordion__heading">
              <span class="chip">${esc(meeting.monthLabel)}</span>
              <span class="meeting-accordion__title">${esc(meeting.name)}</span>
            </span>
            <span class="meeting-accordion__summary">${esc(meeting.summary)}</span>
            ${meetingCountsHtml(meeting, related)}
          </span>
          <span class="meeting-accordion__icon" aria-hidden="true"></span>
        </summary>
        <div class="meeting-accordion__content"><section><div class="container">
        <h2>${esc(meeting.detailTitle || meeting.name)}</h2>
        <p class="section-lead">${esc(meeting.detailLead || meeting.summary)}</p>
        <p><a class="pill" href="kaigi.html?year=${esc(year.id)}&meeting=${esc(meeting.id)}">この会議を1ページで見る</a></p>
        ${statsHtml(meeting.stats)}
        ${timelineHtml(meeting.events, site)}`;

      // 公開済み委員会の質疑・答弁と、会議録公開待ちの台帳
      if (committeeSessions.length > 0 || committeePending.length > 0) {
        // 正式会議録が公開されている会議は全文、まだの会議は校正原稿からの抜粋。
        // 見出しの件数も、全文の会議は発言数で数える。
        const draftSessions = committeeSessions.filter((session) => !session.hasFullText);
        const exchangeCount = draftSessions.reduce((total, session) =>
          total + (session.topics || []).reduce((topicTotal, topic) => topicTotal + (topic.exchanges || []).length, 0), 0);
        const voiceCount = committeeSessions.reduce(
          (total, session) => total + (session.hasFullText ? (session.sourceMeta || {}).voices || 0 : 0), 0);
        html += recordSectionHtml({
          id: `committee-qa-${meeting.id}`,
          title: "委員会での質疑・答弁",
          lead: draftSessions.length
            ? "正式会議録が公開されている会議は、公式会議録の全文をそのまま掲載しています。公開前の会議は校正原稿から質問・答弁を抜き出して掲載しています。"
            : "公式会議録の全文を、要約せずそのまま掲載しています。",
          countLabel: `${committeeSessions.length}会議${voiceCount ? `・${voiceCount}発言` : ""}${exchangeCount ? `・抜粋${exchangeCount}件` : ""}${committeePending.length ? `／公開待ち等${committeePending.length}会議` : ""}`,
          content: committeeSessionsHtml(committeeSessions, committeePending),
          open: false
        });
      }

      // 注目議案（見出し付き／見出しなしのグリッド両対応）
      if (bills.length > 0) {
        const sec = meeting.billsSection || {};
        html += recordSectionHtml({
          id: `bills-${meeting.id}`,
          title: sec.title || "議案",
          lead: sec.lead || "公式の提出議案ページに掲載された議案を全件表示します。",
          countLabel: `${bills.length}件`,
          content: `<div class="card-grid">${bills.map((b) => billCardHtml(b, site)).join("")}</div>`,
          open: bills.length <= 6
        });
      }

      // 請願・陳情
      if (petitions.length > 0) {
        const sec = meeting.petitionsSection || {};
        html += recordSectionHtml({
          id: `petitions-${meeting.id}`,
          title: sec.title || "請願・陳情",
          lead: sec.lead || "公式の提出議案ページに掲載された請願・陳情を全件表示します。",
          countLabel: `${petitions.length}件`,
          content: `<div class="rows">${petitions.map((p) => petitionRowHtml(p, site)).join("")}</div>`,
          open: petitions.length <= 6
        });
      }

      // 本会議の会議録全文（開催日ごと）
      const plenaryDays = (year.plenaryMinutes || [])
        .filter((day) => day.meetingId === meeting.id && day.hasFullText);
      if (plenaryDays.length > 0) {
        const characters = plenaryDays.reduce((total, day) => total + (day.characters || 0), 0);
        html += recordSectionHtml({
          id: `plenary-${meeting.id}-fulltext`,
          title: "本会議の会議録全文",
          lead: "公式の正式会議録を、開催日ごとに全文そのまま掲載しています。質問・答弁の要約では拾いきれない部分は、こちらでお読みください。",
          countLabel: `${plenaryDays.length}日・約${Math.round(characters / 10000)}万字`,
          content: plenaryFullTextHtml(plenaryDays),
          open: false
        });
      }

      // 代表質問・一般質問
      if (questions.length > 0) {
        const sec = meeting.questionsSection || {};
        const hasQaSummaries = questions.some((q) => (q.qaSummaries || []).length > 0);
        const links = sec.links && sec.links.length > 0 ? `<p>${pillsHtml(sec.links, site)}</p>` : "";
        html += recordSectionHtml({
          id: `questions-${meeting.id}`,
          title: sec.title || "代表質問・一般質問",
          lead: sec.lead || "公式の発言項目を省略せず掲載し、会議録から質問と答弁を要約しています。",
          countLabel: `${questions.length}名`,
          content: `${links}<div class="card-grid${hasQaSummaries ? " question-card-grid--summaries" : ""}">${questions.map((q) => questionCardHtml(q, site)).join("")}</div>`,
          open: questions.length <= 6
        });
      }

      html += `</div></section></div></details>`;
      return html;
    }

    // 会議録（議事録）コーナー
    function minutesSectionHtml(minutes, site) {
      const official = minutes.officialLists.map((o) => `
        <div class="row">
          <span class="key">${esc(o.category)}</span>
          <span>${esc(o.title)}</span>
          <a class="pill pill--minutes" href="${esc(o.url)}" target="_blank" rel="noopener">一覧を開く</a>
        </div>`).join("");

      const groups = minutes.draftGroups.map((g) => `
        <h3 class="group-title">${esc(g.title)}</h3>
        <div class="rows">${g.items.map((item) => `
          <div class="row">
            <span class="key">${esc(item.date)}</span>
            <span>${esc(item.meeting)}</span>
            <a class="pill pill--minutes" href="${esc(item.url)}" target="_blank" rel="noopener">PDFで読む</a>
          </div>`).join("")}</div>`).join("");

      return `<details class="meeting-accordion minutes-accordion" id="minutes">
        <summary>
          <span>
            <span class="meeting-accordion__heading">
              <span class="chip">資料</span>
              <span class="meeting-accordion__title">会議録（議事録）を読む</span>
            </span>
            <span class="meeting-accordion__summary">正式な会議録と、直近の校正原稿PDFをまとめて確認できます。</span>
          </span>
          <span class="meeting-accordion__icon" aria-hidden="true"></span>
        </summary>
        <div class="meeting-accordion__content"><section><div class="container">
        <h2>会議録（議事録）を読む</h2>
        <p class="section-lead">${esc(minutes.lead)}</p>
        <div class="notice">${esc(minutes.notice)}</div>
        <p>${(minutes.searchLinks || []).map(pillHtml).join("\n")}</p>
        <h3 class="group-title" id="minutes-official">${esc(minutes.officialTitle)}</h3>
        <p class="section-lead">${esc(minutes.officialLead)}</p>
        <div class="rows">${official}</div>
        ${groups}
        <p class="fine-print">${esc(minutes.asOfNote)}</p>
      </div></section></div></details>`;
    }

    // 現在表示中の折りたたみ要素
    function accordions() {
      return [...document.querySelectorAll("#detail-root .meeting-accordion")];
    }

    // 全開閉ボタンの状態と読み上げ用の件数を更新する
    function updateAccordionControls() {
      const items = accordions();
      const controls = document.getElementById("accordion-controls");
      controls.hidden = items.length === 0;
      if (items.length === 0) return;
      const openCount = items.filter((item) => item.open).length;
      document.getElementById("accordion-status").textContent = `${openCount} / ${items.length}件を表示中`;
      document.getElementById("open-all").disabled = openCount === items.length;
      document.getElementById("close-all").disabled = openCount === 0;
    }

    function setAllAccordions(open) {
      for (const item of accordions()) item.open = open;
      if (open) {
        for (const details of document.querySelectorAll("#detail-root .committee-session")) {
          renderCommitteeSession(details);
        }
      }
      for (const details of document.querySelectorAll("#detail-root .record-section, #detail-root .card.q, #detail-root .committee-session, #detail-root .committee-topic")) {
        details.open = open;
      }
      updateAccordionControls();
    }

    // details/summary の開閉状態を読み上げ可能にし、Enter・Space操作を明示的に保証する
    function setupDetailsAccessibility(root = document.getElementById("detail-root")) {
      for (const details of root.querySelectorAll("details")) {
        if (details.dataset.a11yReady === "true") continue;
        const summary = [...details.children].find((child) => child.tagName === "SUMMARY");
        if (!summary) continue;
        details.dataset.a11yReady = "true";
        summary.setAttribute("role", "button");
        summary.setAttribute("aria-expanded", String(details.open));
        details.addEventListener("toggle", () => {
          summary.setAttribute("aria-expanded", String(details.open));
          if (details.matches(".committee-session") && details.open) renderCommitteeSession(details);
          // 全文は会議を開いた時点では取りに行かない。1会議で平均130KBあるので、
          // 読む意思表示（全文の開閉を開く）があってから読み込む。
          if (details.matches(".committee-fulltext") && details.open) renderFullText(details);
        });
        summary.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          details.open = !details.open;
        });
      }
    }

    function decodedHashId() {
      try {
        return decodeURIComponent(location.hash.slice(1));
      } catch (err) {
        return "";
      }
    }

    function hashBelongsToYear(hashId, yearId) {
      return ["meeting", "question", "committee", "plenary", "bills", "petitions"]
        .some((prefix) => hashId.startsWith(`${prefix}-${yearId}-`));
    }

    // アンカー先が閉じた会議・資料種別・質問者の内側にある場合は、祖先をすべて開く
    async function openAccordionForHash(shouldScroll) {
      if (!location.hash) return false;
      const hashId = decodedHashId();
      let target = document.getElementById(hashId);
      if (!target && hashId.startsWith("committee-") && activeYear) {
        const session = (activeYear.committeeSessions || []).find((item) =>
          hashId === `committee-${item.id}` || hashId.startsWith(`committee-${item.id}-`));
        const details = session && document.getElementById(`committee-${session.id}`);
        if (details) {
          renderCommitteeSession(details);
          details.open = true;
          target = document.getElementById(hashId);
        }
        // 全文の中の発言を指すアンカー（committee-<会議ID>-v0047）は、全文を
        // 読み込むまでDOMに無い。読み込んでから取り直す。
        if (!target && session && /-(full|v\d+)$/.test(hashId)) {
          await openFullText(session.id);
          target = document.getElementById(hashId);
        }
      }
      // 本会議の全文の中の発言（plenary-<会議ID>-v0008）も同じ。開閉そのものは
      // 資料種別の節に最初から置いてあるので、読み込みだけ待てばよい。
      if (!target && hashId.startsWith("plenary-") && activeYear) {
        const day = (activeYear.plenaryMinutes || []).find((item) =>
          hashId.startsWith(`plenary-${item.id}-`));
        if (day) {
          await openFullText(day.id);
          target = document.getElementById(hashId);
        }
      }
      if (!target) return false;
      if (target.matches("details")) target.open = true;
      let ancestor = target.parentElement && target.parentElement.closest("details");
      while (ancestor) {
        ancestor.open = true;
        ancestor = ancestor.parentElement && ancestor.parentElement.closest("details");
      }
      updateAccordionControls();
      if (shouldScroll) scrollToAnchor(target);
      return true;
    }

    // 発言のアンカー（committee-<会議ID>-v0047）は全文を読み込むまでDOMに無い。
    // 読み込みは非同期なので、位置を合わせた直後にブラウザ側の読み込みが終わって
    // 先頭へ戻されることがある（移動先を見つけられないまま復元がかかる）。
    // 実際、同じアンカーでも合う回と合わない回があった。
    //
    // 合わせ直すのはずれているときだけで、利用者が自分で動かしたらそこでやめる。
    function scrollToAnchor(target) {
      let cancelled = false;
      // 利用者が自分で動かしたら、そこで見張りをやめる
      const stop = () => { cancelled = true; };
      for (const type of ["wheel", "touchstart", "keydown"]) {
        window.addEventListener(type, stop, { once: true, passive: true });
      }
      // ずれているときだけ動かす。位置が合ったあとでも、上にある開閉の中身が
      // 描かれて数万px ずれることがあるので、5秒のあいだ見張り続ける。
      // 1回合わせて終わりにすると、合う回と合わない回が出る。
      const tick = (remaining) => {
        if (cancelled || remaining <= 0) return;
        if (Math.abs(target.getBoundingClientRect().top) >= 4) {
          target.scrollIntoView({ block: "start" });
        }
        setTimeout(() => tick(remaining - 1), 120);
      };
      // requestAnimationFrame は使わない。裏に回っているタブでは発火しないので、
      // 別タブで開いたリンクが位置合わせされないまま残る。
      setTimeout(() => tick(40), 0);
    }

    function setupAccordions() {
      setupDetailsAccessibility();
      for (const item of accordions()) item.addEventListener("toggle", updateAccordionControls);
      updateAccordionControls();
      openAccordionForHash(false);
    }

    // 抜粋の「原文を読む」。全文を読み込んでからでないと移動先がDOMに無いので、
    // 既定の遷移は止めて、読み込みを待ってから位置を合わせる。
    function setupVoiceJump() {
      document.addEventListener("click", async (event) => {
        const link = event.target.closest("a[data-voice-jump]");
        if (!link) return;
        event.preventDefault();
        const hashId = decodeURIComponent(link.hash.slice(1));
        await openFullText(link.dataset.voiceJump);
        const target = document.getElementById(hashId);
        if (!target) return;
        // 同じアンカーを続けて押しても動くよう、hashchange任せにしない
        history.replaceState(null, "", `#${link.hash.slice(1)}`);
        requestAnimationFrame(() => target.scrollIntoView({ block: "center" }));
      });
    }

    // 参照元
    function renderSources(site) {
      const items = (site.sources || []).map((s) =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`
      ).join("");
      document.getElementById("sources-root").innerHTML = `
        <h2>参照元</h2>
        <ul>${items}</ul>
        <p class="fine-print">${esc(site.sourcesNote)}</p>`;
    }

    // フッター（免責の再掲＋更新日）
    function renderFooter(site, year) {
      document.getElementById("footer-root").innerHTML =
        `${esc(site.siteName)} — ${esc(site.disclaimer)}<br />データ最終更新日: ${esc(year.updatedAt)}`;
    }

    // 年データ全体の描画（会議をすべて並べた後、会議録コーナーを必ず最後尾に置く）
    function renderYear(year, site) {
      activeYear = year;
      activeSite = site;
      renderHero(site);
      renderYearOverview(year, site);

      let html = `<div class="container accordion-list">`;
      for (const meeting of orderedMeetings(year)) {
        if (hasMeetingDetails(meeting, year)) {
          html += meetingSectionHtml(meeting, year, site);
        }
      }
      if (year.minutes) html += minutesSectionHtml(year.minutes, site);
      html += `</div>`;

      document.getElementById("detail-root").innerHTML = html;
      setupAccordions();
      renderFooter(site, year);
    }

    /* ---------- 初期化 ---------- */

    // 読み込み失敗時の案内
    function showLoadError(err) {
      document.getElementById("detail-root").innerHTML = `
        <div class="load-error container">
          <strong>データを読み込めませんでした。</strong><br />
          ${esc(err.message)}<br /><br />
          <code>index.html</code> と同じ場所に <code>data</code> フォルダ（data/site.js、data/r08.js など）が
          あるか確認してください。フォルダごと移動・コピーすれば、そのまま動きます。
        </div>`;
    }

    async function init() {
      const db = window.SHINAGAWA_DB;
      if (!db || !db.site) {
        showLoadError(new Error("data/site.js が読み込まれていません"));
        return;
      }
      const site = db.site;
      setupVoiceJump();
      renderSources(site);

      const sel = document.getElementById("year-select");

      document.getElementById("open-all").addEventListener("click", () => setAllAccordions(true));
      document.getElementById("close-all").addEventListener("click", () => setAllAccordions(false));

      // 指定された年のデータを読み込んで描画する
      async function showYear(yearId) {
        const meta = site.years.find((y) => y.id === yearId && y.available);
        if (!meta) return;
        try {
          const year = await loadYearData(meta);
          renderYearSelect(site, yearId);
          renderYear(year, site);
        } catch (err) {
          showLoadError(err);
        }
      }

      // 別の年の会議アンカーへ移動した場合は、年も切り替えてから対象を開く
      async function showHashTarget() {
        const hashId = decodedHashId();
        const hashYear = site.years.find((y) => hashBelongsToYear(hashId, y.id) && y.available);
        if (hashYear && sel.value !== hashYear.id) await showYear(hashYear.id);
        await openAccordionForHash(true);
      }

      sel.addEventListener("change", () => showYear(sel.value));
      window.addEventListener("hashchange", showHashTarget);

      // 会議アンカーが指定されていれば、その会議が属する年を最初に表示する
      const hashId = decodedHashId();
      const hashYear = site.years.find((y) => hashBelongsToYear(hashId, y.id) && y.available);
      await showYear(hashYear ? hashYear.id : site.defaultYear);
      await openAccordionForHash(true);
    }

    init();
  </script>
  <script src="site-nav.js"></script>
  <script src="site-a11y.js"></script>
</body>
</html>
