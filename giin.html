<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0017c1" />
  <title>現職区議名簿 | 品川区議会DB</title>
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="site-base.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <link rel="stylesheet" href="site-controls.css" />
  <link rel="stylesheet" href="site-mobile.css" />
  <link rel="stylesheet" href="site-a11y.css" />
  <style>
    /* ===== index.html と同じ基調カラー ===== */
    /* 配色はサイト共通の site-theme.css（デジタル庁デザインシステム準拠）で
       一元管理している。ここで :root を再定義すると上書きしてしまうので置かない */

    .disclaimer {
      margin-top: 18px; max-width: 840px; padding: 14px 16px;
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); font-size: 14px; line-height: 1.7;
    }
    /* 名簿8区分の切り替えは site-controls.css の .seg（枠で囲んだセグメント）。
       枠があるのは「このページの中の切り替え」だから。別ページへ行くリンクは
       共通ナビ側に置き、枠を付けない */
    .roster-switch { margin-top: 18px; }

    /* ===== 絞り込み ===== */
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      margin: 0 0 8px;
    }
    .controls label { color: var(--c-ink-soft); font-size: 14px; font-weight: 800; }
    #search-box, #party-select {
      border: 1px solid var(--c-border); border-radius: 3px;
      background: var(--c-card); padding: 10px 12px;
      color: var(--c-ink); font-size: 15px;
    }
    #search-box { width: min(100%, 320px); }
    #party-select { font-weight: 800; }
    #hit-count { color: var(--c-ink-soft); font-size: 13px; font-weight: 700; }

    /* ===== 議員カード ===== */
    .member-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px; margin-top: 20px;
    }
    .member-card {
      border: 1px solid var(--c-border); border-left: 4px solid var(--c-main); border-radius: 3px;
      background: var(--c-card); padding: 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    /* 選挙アーカイブなど他ページから #member-<id> で指定された人物を目立たせる */
    .member-card.is-focused {
      border-left-color: var(--c-main); box-shadow: 0 0 0 3px var(--c-main-pale-2);
    }
    .member-card h2 { margin: 0; font-size: 20px; line-height: 1.4; }
    .member-card .kana { color: var(--c-ink-soft); font-size: 12px; font-weight: 700; }

    .tag {
      display: inline-flex; margin: 0 6px 4px 0; border-radius: 3px;
      background: var(--c-main-pale); padding: 4px 10px;
      color: var(--c-main-dark); font-size: 12px; font-weight: 800;
    }
    .chip {
      display: inline-flex; margin: 0 6px 4px 0; border-radius: 3px;
      background: var(--c-surface-sub); padding: 4px 10px; color: var(--c-ink-soft);
      font-size: 12px; font-weight: 800;
    }

    .committee { margin: 0; color: var(--c-ink-soft); font-size: 13px; line-height: 1.7; }
    .committee strong { color: var(--c-ink); }

    .pill {
      display: inline-flex; align-items: center; margin: 4px 6px 0 0;
      border: 1px solid var(--c-border); border-radius: 3px;
      background: var(--c-card); padding: 6px 12px;
      color: var(--c-main-dark); font-size: 13px; font-weight: 800;
    }

    /* 後から情報を入れる枠（SNS・選挙履歴・政治資金収支報告書・政務活動費） */
    .extra-slot { font-size: 13px; line-height: 1.9; }
    .extra-slot .slot-name { color: var(--c-ink); font-weight: 800; }
    .pending {
      display: inline-flex; border-radius: 3px; background: var(--c-surface-sub);
      padding: 2px 10px; color: var(--c-ink-mute); font-size: 12px; font-weight: 700;
    }

    /* 詳細の開閉 */
    details { margin-top: 8px; border-top: 1px solid var(--c-border); padding-top: 10px; }
    summary {
      cursor: pointer; color: var(--c-main-dark); font-size: 13px; font-weight: 800;
      list-style-position: inside;
    }
    .question-years { margin-top: 6px; width: 100%; }
    .question-years summary { cursor: pointer; color: var(--c-main-dark); font-size: 12px; font-weight: 700; }
    .question-years > div { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .detail-table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 13px; }
    .detail-table th, .detail-table td {
      border: 1px solid var(--c-border); padding: 8px 10px;
      text-align: left; vertical-align: top; line-height: 1.7;
    }
    .detail-table th {
      width: 34%; background: var(--c-main-pale);
      color: var(--c-ink); font-weight: 800; white-space: nowrap;
    }
    .detail-table td { color: var(--c-ink-soft); }

    .empty-state {
      grid-column: 1 / -1; padding: 28px; border: 1px dashed var(--c-border);
      border-radius: 3px; background: var(--c-card); line-height: 1.9;
    }
    .empty-state h2 { margin: 0 0 8px; font-size: 20px; }
    .empty-state p { margin: 0; color: var(--c-ink-soft); }

    @media (max-width: 640px) {
      .member-grid { grid-template-columns: 1fr; }
      /* iOSで入力・選択時に画面が自動で拡大しないよう16pxにする */
      #search-box, #party-select { width: 100%; font-size: 16px; }
      .controls { flex-direction: column; align-items: stretch; }
      /* 「詳しい情報を見る」を指で押しやすい高さにする */
      summary { min-height: 44px; padding: 11px 2px; }
      .detail-table th { width: auto; white-space: normal; }
    }
  </style>
</head>
<body>
  <main>
    <div class="hero">
      <div class="container">
        <p class="breadcrumb"><a href="index.html">← 品川区議会DB トップへ</a></p>
        <h1 id="page-title">現職品川区議会議員名簿</h1>
        <p class="lead" id="page-lead">
          品川区議会の議員紹介ページを基に、議員の情報を一覧できるようにしたページです。名前・会派・委員会で検索できます。過去の選挙・得票履歴は、出典確認後に追加できるよう項目を準備しています。
        </p>
        <div class="disclaimer" id="page-disclaimer">
          これは品川区が運営しているものではありません。掲載情報は品川区議会公式サイトからの転記です。最新かつ正確な情報は必ず<a href="https://gikai.city.shinagawa.tokyo.jp/profile/50on" target="_blank" rel="noopener">公式の議員紹介ページ</a>を確認してください。
        </div>
        <nav data-site-nav></nav>
        <nav class="seg roster-switch" aria-label="政治家名簿の切り替え">
          <a data-roster="current-ward" href="giin.html">現職区議</a>
          <a data-roster="former-ward" href="giin.html?view=former-ward">元職区議</a>
          <a data-roster="current-tokyo" href="giin.html?view=current-tokyo">現職都議</a>
          <a data-roster="former-tokyo" href="giin.html?view=former-tokyo">元職都議</a>
          <a data-roster="current-house" href="giin.html?view=current-house">現職衆議</a>
          <a data-roster="former-house" href="giin.html?view=former-house">元職衆議</a>
          <a data-roster="current-mayor" href="giin.html?view=current-mayor">現職区長</a>
          <a data-roster="former-mayor" href="giin.html?view=former-mayor">元職区長</a>
        </nav>
      </div>
    </div>

    <section>
      <div class="container">
        <div class="controls">
          <label for="search-box">検索</label>
          <input id="search-box" type="search" placeholder="名前・ふりがな・会派・役職など" />
          <label for="party-select">会派・政党</label>
          <select id="party-select"><option value="">すべて</option></select>
          <span id="hit-count"></span>
        </div>
        <div id="member-root" class="member-grid"></div>
        <p class="fine-print" id="as-of-note"></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container" id="footer-root"></div>
  </footer>

  <!-- データ読み込み（script形式なので file:// のダブルクリックでも動く） -->
  <script src="data/site.js"></script>
  <script src="site-nav.js"></script>
  <script src="data/members.js"></script>
  <script src="data/former-members.js"></script>
  <script src="data/speaker-members.js"></script>
  <script src="data/politicians.js"></script>

  <script>
    "use strict";

    /* ---------- ユーティリティ ---------- */

    // HTMLエスケープ（データ由来の文字列は必ずこれを通す）
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // 改行を <br> にして表示する（履歴など複数行の項目用）
    function multiline(s) {
      return esc(s).replace(/\n/g, "<br />");
    }

    // 表示中の名簿（区議／都議／衆議／区長）。枠ごとに案内先が違う制度の判定に使う
    let currentRosterId = "current-ward";

    // 会派名から役職を除いた部分（絞り込み用）
    function partyName(member) {
      return (member.party || "").replace(/（.*$/, "");
    }

    function personSearchName(member) {
      return String(member.name || "").replace(/（[^）]*）\s*$/, "").trim();
    }

    /* ---------- カードの描画 ---------- */

    // 後から情報を入れる枠。データが空のうちは「準備中」を表示する
    function extraSlotHtml(slotName, items) {
      const body = (items && items.length > 0)
        ? items.map((it) =>
            `<a class="pill" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.label)}</a>`
          ).join("")
        : `<span class="pending">準備中</span>`;
      return `<div class="extra-slot"><span class="slot-name">${esc(slotName)}:</span> ${body}</div>`;
    }

    // 政務活動費は議会ごとの制度。DB内の資料（data/seimu.js）は品川区議会の会派が対象なので、
    // 都議は東京都議会の公開ページへ案内し、区長・国会議員は制度の対象外であることを示す。
    const ACTIVITY_EXPENSE_POLICY = {
      "current-tokyo": {
        kind: "external",
        label: "東京都議会の公開ページへ",
        url: "https://www.gikai.metro.tokyo.lg.jp/informationdisclosure/expenditure/list.html"
      },
      "former-tokyo": {
        kind: "external",
        label: "東京都議会の公開ページへ",
        url: "https://www.gikai.metro.tokyo.lg.jp/informationdisclosure/expenditure/list.html"
      },
      "current-house": { kind: "none", note: "国会議員は制度の対象外" },
      "former-house": { kind: "none", note: "国会議員は制度の対象外" },
      "current-mayor": { kind: "none", note: "区長は制度の対象外" },
      "former-mayor": { kind: "none", note: "区長は制度の対象外" }
    };

    function activityExpenseSlotHtml(member) {
      if (member.activityExpenses && member.activityExpenses.length > 0) return extraSlotHtml("政務活動費", member.activityExpenses);
      const policy = ACTIVITY_EXPENSE_POLICY[currentRosterId];
      if (policy && policy.kind === "none") {
        return `<div class="extra-slot"><span class="slot-name">政務活動費:</span> <span class="pending">${esc(policy.note)}</span></div>`;
      }
      if (policy && policy.kind === "external") {
        return `<div class="extra-slot"><span class="slot-name">政務活動費:</span> <a class="pill" href="${esc(policy.url)}" target="_blank" rel="noopener">${esc(policy.label)}</a></div>`;
      }
      const query = encodeURIComponent(partyName(member) || member.name || "");
      return `<div class="extra-slot"><span class="slot-name">政務活動費:</span> <a class="pill" href="seimu.html?q=${query}">所属会派・議員名で探す</a></div>`;
    }

    function politicalFundSlotHtml(member) {
      if (member.fundReports && member.fundReports.length > 0) return extraSlotHtml("政治資金収支報告書", member.fundReports);
      const query = encodeURIComponent(personSearchName(member));
      return `<div class="extra-slot"><span class="slot-name">政治資金収支報告書:</span> <a class="pill" href="seijishikin.html?q=${query}">団体名簿で検索</a></div>`;
    }

    // 会議録での発言（横断検索へ）。kensakuが質問インデックスに人物台帳のエイリアスを含めるため、
    // 名簿の表示名で検索リンクを作れば漢字・かなの表記揺れは自動で吸収される。
    function speechSlotHtml(member) {
      const query = encodeURIComponent(personSearchName(member));
      return `<div class="extra-slot"><span class="slot-name">会議録での発言:</span> <a class="pill" href="kensaku.html?q=${query}&category=council">発言を横断検索で見る</a></div>`;
    }

    // 年度ID（h13 / r07）を見出しに直す。年データ（1年6MB）を読まずに出したいので、
    // year.label は使わずここで組み立てる。
    function yearLabel(yearId) {
      const era = yearId.charAt(0) === "h" ? "平成" : "令和";
      const number = Number(yearId.slice(1));
      return `${era}${number === 1 ? "元" : number}年`;
    }

    // 委員会での質疑。data/speaker-members.js の年度索引だけで件数を出し、
    // 中身は会議録ページ（年ごとに読み込む）へ渡す。カードに質疑本文は載せない。
    function questionSlotHtml(member) {
      const index = (window.SHINAGAWA_DB && window.SHINAGAWA_DB.memberQuestionIndex) || {};
      const years = index[member.id];
      if (!years) return "";
      const ids = Object.keys(years).sort();
      if (ids.length === 0) return "";
      const total = ids.reduce((sum, id) => sum + years[id], 0);
      const latest = ids[ids.length - 1];
      const link = (id) =>
        `<a class="pill" href="kaigiroku.html?member=${encodeURIComponent(member.id)}&year=${encodeURIComponent(id)}">${esc(yearLabel(id))}<span class="chip">${years[id]}</span></a>`;
      // 年度が多い議員は25年度分になる。既定は直近だけ出し、残りは開閉に入れる。
      const rest = ids.slice(0, -1).reverse();
      return `
        <div class="extra-slot">
          <span class="slot-name">委員会での質疑:</span>
          <span>${total.toLocaleString()}件・${ids.length}年度</span>
          ${link(latest)}
          ${rest.length ? `<details class="question-years">
            <summary>年度別に見る（${rest.length}年度）</summary>
            <div>${rest.map(link).join("")}</div>
          </details>` : ""}
        </div>`;
    }

    // 過去の選挙・得票履歴（選挙アーカイブへ）。person で人物IDを渡し、senkyo側で
    // 人物台帳のエイリアス（改姓・かな/漢字などの別表記）も名寄せ照合させる。
    // q は台帳未収録者向けのフォールバック兼、検索欄の表示用。
    function electionSlotHtml(member) {
      const query = encodeURIComponent(personSearchName(member));
      const personParam = member.id ? `person=${encodeURIComponent(member.id)}&` : "";
      return `<div class="extra-slot"><span class="slot-name">過去の選挙・得票履歴:</span> <a class="pill" href="senkyo.html?${personParam}q=${query}">選挙アーカイブで探す</a></div>`;
    }

    function electionFinanceSlotHtml(member) {
      const query = encodeURIComponent(personSearchName(member));
      return `<div class="extra-slot"><span class="slot-name">選挙収支報告書:</span> <a class="pill" href="senkyo-shushi.html?person=${encodeURIComponent(member.id || "")}&q=${query}">候補者名で探す</a></div>`;
    }

    // 詳細テーブルの1行（値が空の項目は行ごと省略する）
    function detailRow(label, value, isMultiline) {
      if (!value) return "";
      return `<tr><th>${esc(label)}</th><td>${isMultiline ? multiline(value) : esc(value)}</td></tr>`;
    }

    function memberCardHtml(m) {
      // 外部リンク（公式プロフィール・議員HP・メール）
      let links = m.profileUrl
        ? `<a class="pill" href="${esc(m.profileUrl)}" target="_blank" rel="noopener">公式プロフィール</a>`
        : "";
      if (m.websiteUrl) links += `<a class="pill" href="${esc(m.websiteUrl)}" target="_blank" rel="noopener">議員ホームページ</a>`;
      if (m.email) links += `<a class="pill" href="mailto:${esc(m.email)}">メール</a>`;

      const committees = [];
      if (m.standingCommittee) committees.push(`<strong>常任:</strong> ${esc(m.standingCommittee)}`);
      if (m.specialCommittee) committees.push(`<strong>特別:</strong> ${multiline(m.specialCommittee)}`);

      return `
        <article class="member-card" id="member-${esc(m.id)}" data-party="${esc(partyName(m))}">
          <div>
            <h2>${esc(m.name)}</h2>
            <span class="kana">${esc(m.kana)}</span>
          </div>
          <div>
            <span class="tag">${esc(m.party || m.office || m.statusLabel || "掲載準備中")}</span>
            ${m.elections ? `<span class="chip">当選${esc(m.elections)}</span>` : ""}
          </div>
          ${committees.length ? `<p class="committee">${committees.join("<br />")}</p>` : ""}
          ${links ? `<div>${links}</div>` : ""}
          ${extraSlotHtml("SNS", m.sns)}
          ${speechSlotHtml(m)}
          ${questionSlotHtml(m)}
          ${electionSlotHtml(m)}
          ${electionFinanceSlotHtml(m)}
          ${politicalFundSlotHtml(m)}
          ${activityExpenseSlotHtml(m)}
          <details>
            <summary>詳しい情報を見る</summary>
            <table class="detail-table">
              ${detailRow("役職", m.office)}
              ${detailRow("選挙区", m.electoralDistrict)}
              ${detailRow("任期", m.term)}
              ${detailRow("生年月日", m.birth)}
              ${detailRow("住所または事務所の所在地", m.address)}
              ${detailRow("出身地", m.birthplace)}
              ${detailRow("電話番号", m.tel)}
              ${detailRow("ファクス番号", m.fax)}
              ${detailRow("附属機関委員等", m.affiliated, true)}
              ${detailRow("職業", m.occupation, true)}
              ${detailRow("主な履歴", m.career, true)}
              ${detailRow("在職・発言確認期間", m.serviceHistory, true)}
              ${detailRow("品川区議会DBの発言年度", m.questionYears, true)}
              ${detailRow("趣味", m.hobby, true)}
            </table>
          </details>
        </article>`;
    }

    /* ---------- 絞り込み ---------- */

    function applyFilter(members) {
      const q = document.getElementById("search-box").value.trim().toLowerCase();
      const party = document.getElementById("party-select").value;
      return members.filter((m) => {
        if (party && partyName(m) !== party) return false;
        if (!q) return true;
        const haystack = [m.name, m.kana, m.party, m.office, m.electoralDistrict, m.standingCommittee, m.specialCommittee, m.occupation]
          .join(" ").toLowerCase();
        return haystack.includes(q);
      });
    }

    /* ---------- 初期化 ---------- */

    const ROSTER_CONFIG = {
      "current-ward": {
        label: "現職区議",
        title: "現職品川区議会議員名簿",
        lead: "品川区議会の現職区議を一覧できるページです。名前・会派・委員会などで検索できます。過去の選挙・得票履歴は、出典確認後に追加できるよう項目を準備しています。"
      },
      "former-ward": {
        label: "元職区議",
        title: "元職品川区議会議員名簿",
        lead: "過去に品川区議会議員を務めた方を、在職時の議会活動とともに確認するための名簿です。具体的な人物情報は出典確認後に掲載します。"
      },
      "current-tokyo": {
        label: "現職都議",
        title: "現職東京都議会議員名簿（品川区選出）",
        lead: "品川区選挙区から選出された現職の東京都議会議員です。東京都議会公式サイトと選挙アーカイブを基に作成しています。会議録での発言・選挙履歴などは各カードのリンクから確認できます。"
      },
      "former-tokyo": {
        label: "元職都議",
        title: "元職東京都議会議員名簿（品川区選出）",
        lead: "過去に品川区選挙区から選出された東京都議会議員です。都議選アーカイブ（1997年〜）の当選者を基に作成しています。区議・区長を兼ねた方は同一人物として選挙・発言を横断できます。"
      },
      "current-house": {
        label: "現職衆議",
        title: "現職衆議院議員名簿（品川区選出）",
        lead: "品川区を含む東京都第3区（品川区・伊豆諸島・小笠原諸島）から選出された現職の衆議院議員です。総選挙の結果を基に作成しています。"
      },
      "former-house": {
        label: "元職衆議",
        title: "元職衆議院議員名簿（品川区選出）",
        lead: "過去に東京都第3区（品川区を含む）から選出された衆議院議員です。区議・都議を兼ねた方は同一人物として選挙・発言を横断できます。"
      },
      "current-mayor": {
        label: "現職区長",
        title: "現職品川区長名簿",
        lead: "現職の品川区長です。区長選挙の結果と公式情報を基に作成しています。"
      },
      "former-mayor": {
        label: "元職区長",
        title: "元職品川区長名簿",
        lead: "過去に品川区長を務めた方です。区長選挙の結果と公式情報を基に作成しています。"
      }
    };

    function selectedRosterId() {
      const value = new URLSearchParams(window.location.search).get("view") || "current-ward";
      if (value === "former") return "former-ward";
      return ROSTER_CONFIG[value] ? value : "current-ward";
    }

    function rosterData(db, rosterId) {
      if (!db) return null;
      if (rosterId === "current-ward") return db.membersData;
      if (rosterId === "former-ward") return db.formerMembersData;
      const collection = db.politiciansData;
      const roster = collection && collection.rosters && collection.rosters[rosterId];
      if (!roster) return null;
      return {
        updatedAt: collection.updatedAt,
        note: collection.note,
        members: roster.members || []
      };
    }

    function init() {
      const db = window.SHINAGAWA_DB;
      const rosterId = selectedRosterId();
      currentRosterId = rosterId;
      const config = ROSTER_CONFIG[rosterId];
      const data = rosterData(db, rosterId);
      if (!data) {
        document.getElementById("member-root").innerHTML = `
          <div class="load-error">
            <strong>データを読み込めませんでした。</strong><br />
            議員名簿のデータファイルが正しく配置されているか確認してください。
          </div>`;
        return;
      }
      const members = data.members;
      const params = new URLSearchParams(window.location.search);

      document.title = `${config.title} | 品川区議会DB`;
      document.getElementById("page-title").textContent = config.title;
      document.getElementById("page-lead").textContent = config.lead;
      document.getElementById("page-disclaimer").innerHTML = rosterId === "current-ward"
        ? "これは品川区が運営しているものではありません。現職区議の掲載情報は品川区議会公式サイトからの転記です。最新かつ正確な情報は必ず<a href=\"https://gikai.city.shinagawa.tokyo.jp/profile/50on\" target=\"_blank\" rel=\"noopener\">公式の議員紹介ページ</a>を確認してください。"
        : rosterId === "current-tokyo"
          ? "これは品川区・東京都が運営しているものではありません。現職都議の掲載情報は<a href=\"https://www.gikai.metro.tokyo.lg.jp/membership/\" target=\"_blank\" rel=\"noopener\">東京都議会公式サイト</a>からの転記です。最新かつ正確な情報は必ず公式サイトを確認してください。"
          : rosterId === "former-tokyo"
            ? "これは品川区・東京都が運営しているものではありません。元職都議は、品川区選挙区の選挙結果（選挙アーカイブ）を基に作成しています。在職期間には選挙結果からの推定を含みます。"
            : members.length
              ? `これは品川区が運営しているものではありません。${esc(config.label)}の情報は、公開されている公式資料を基に作成しています。正確な情報は各公式サイトをご確認ください。`
              : `これは品川区が運営しているものではありません。${esc(config.label)}については、在職・選出を確認できる公式資料と確認日を明記した上で掲載します。現在は枠組みのみ準備しています。`;
      document.querySelector(`[data-roster="${rosterId}"]`).setAttribute("aria-current", "page");
      document.getElementById("search-box").value = params.get("q") || "";

      // 会派の選択肢をデータから自動生成（掲載順を保ちつつ重複排除）
      const parties = [...new Set(members.map(partyName))];
      const sel = document.getElementById("party-select");
      sel.innerHTML = `<option value="">すべての会派・政党</option>` +
        parties.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join("");

      function render() {
        const list = applyFilter(members);
        document.getElementById("member-root").innerHTML = list.length
          ? list.map(memberCardHtml).join("")
          : `<div class="empty-state" role="status">
              <h2>${members.length ? "該当する人物はいません" : `${esc(config.label)}名簿は準備中です`}</h2>
              <p>${members.length
                ? "検索条件を変更して、もう一度お試しください。"
                : "人物名、在職・選出期間、会派・政党、選挙履歴などを、参考資料の確認後に追加します。"}</p>
            </div>`;
        document.getElementById("hit-count").textContent = `${list.length}名 / 全${members.length}名`;
      }

      document.getElementById("search-box").addEventListener("input", render);
      sel.addEventListener("change", render);

      document.getElementById("as-of-note").textContent = `${data.note}（データ取得日: ${data.updatedAt}）`;
      document.getElementById("footer-root").textContent =
        "品川区議会DB — これは品川区が運営しているものではありません。正確な情報は各機関の公式資料を確認してください。";

      render();
      focusHashTarget();
    }

    // #member-<id> で指定された人物カードまでスクロールして目立たせる。
    // カードはJSで描画するためブラウザ標準の自動スクロールが間に合わないので、描画後に自分で解決する。
    function focusHashTarget() {
      const targetId = decodeURIComponent(String(window.location.hash || "").replace(/^#/, ""));
      if (!targetId) return;
      const target = document.getElementById(targetId);
      if (!target || !target.classList.contains("member-card")) return;
      target.classList.add("is-focused");
      // ブラウザ標準のハッシュジャンプ（上端揃え）が後から走るため、1フレーム待って中央に寄せ直す
      requestAnimationFrame(() => target.scrollIntoView({ block: "center" }));
    }

    init();
  </script>
  <script src="site-a11y.js"></script>
</body>
</html>
