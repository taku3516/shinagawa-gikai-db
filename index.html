<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0017c1" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>品川区議会DB</title>
  <script src="site-a11y.js"></script>
  <link rel="stylesheet" href="site-theme.css" />
  <link rel="stylesheet" href="site-base.css" />
  <link rel="stylesheet" href="site-nav.css" />
  <link rel="stylesheet" href="site-controls.css" />
  <link rel="stylesheet" href="site-mobile.css" />
  <link rel="stylesheet" href="site-a11y.css" />
  <link rel="stylesheet" href="civic.css" />
  <style>
    .disclaimer { margin: 10px 0 0; color: var(--c-ink-soft); font-size: calc(13px * var(--fs)); }
    .home-section { padding-block: 24px; }
    .home-section + .home-section { padding-top: 0; }
    .home-section h2, .sources h2 { margin: 0 0 12px; font-size: calc(22px * var(--fs)); }
    .home-meetings { list-style: none; margin: 0 0 12px; padding: 0; border-bottom: 1px solid var(--c-rule); }
    .home-meetings li {
      display: grid; grid-template-columns: 7rem minmax(0, 1fr) minmax(0, 11rem);
      gap: 4px 16px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--c-rule);
    }
    .home-meetings__period, .home-meetings__resources { color: var(--c-ink-soft); font-size: calc(14px * var(--fs)); }
    .home-meetings__resources { display: flex; flex-wrap: wrap; gap: 0 14px; }
    .home-meetings__title { font-weight: 700; }
    .home-session { margin: 14px 0 0; }
    .home-session h2 { font-size: calc(17px * var(--fs)); }
    .sources { border-top: 1px solid var(--c-rule); background: var(--c-card); }
    .sources ul { margin: 0; padding-left: 20px; line-height: 1.9; }
    @media (max-width: 640px) {
      .home-meetings li { grid-template-columns: minmax(0, 1fr); }
      .home-meetings a { display: inline-flex; align-items: center; min-height: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- サイト名・説明・共通メニュー（JSで描画） -->
    <div class="hero">
      <div class="container" id="hero-root"></div>
    </div>

    <section class="container home-section" aria-labelledby="recent-meetings-title">
      <h2 id="recent-meetings-title">直近の議会</h2>
      <div id="home-meetings"><p role="status">会議を読み込んでいます。</p></div>
      <p><a href="kaigi.html">会議のまとめを見る</a></p>
      <details class="home-session">
        <summary>会期・公式日程</summary>
        <div data-civic-page="session"><p>日程を読み込んでいます。</p></div>
      </details>
    </section>

    <section class="container home-section" aria-labelledby="function-index-title">
      <h2 id="function-index-title">機能を探す</h2>
      <div data-site-index></div>
      <p id="civic-home-counts" class="fine-print"></p>
    </section>

    <!-- 参照元 -->
    <section class="sources">
      <div class="container" id="sources-root"></div>
    </section>
  </main>

  <footer>
    <div class="container" id="footer-root"></div>
  </footer>

  <!-- データ読み込み（script形式なので file:// のダブルクリックでも動く） -->
  <script src="data/site.js"></script>

  <script>
    "use strict";

    /* ---------- ユーティリティ ---------- */

    // HTMLエスケープ（データ由来の文字列は必ずこれを通す）
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    // 年データを取得する。data/*.js が window.SHINAGAWA_DB に登録する方式なので、
    // ローカルでダブルクリックして開いても（file://）動作する
    // ヒーロー（サイト名・説明・免責・入口リンク）
    // ※会期・議案数などの統計は年間で共通ではないため、各定例会のセクションに表示する
    function renderHero(site) {
      document.getElementById("hero-root").innerHTML = `
        <h1>${esc(site.siteName)}</h1>
        <p class="lead">${esc(site.lead)}</p>
        <p class="disclaimer">${esc(site.disclaimer)}</p>
        <nav data-site-nav aria-label="サイトメニュー"></nav>`;
    }

    // 参照元
    function renderSources(site) {
      const items = (site.sources || []).map((s) =>
        `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`
      ).join("");
      document.getElementById("sources-root").innerHTML = `
        <h2>参照元</h2>
        <ul>${items}</ul>
        <p class="fine-print">${esc(site.sourcesNote)}</p>`;
    }

    // 読み込み失敗時の案内
    function showLoadError(err) {
      document.getElementById("hero-root").innerHTML = `
        <div class="load-error container">
          <strong>データを読み込めませんでした。</strong><br />
          ${esc(err.message)}<br /><br />
          <code>index.html</code> と同じ場所に <code>data</code> フォルダ（data/site.js、data/r08.js など）が
          あるか確認してください。フォルダごと移動・コピーすれば、そのまま動きます。
        </div>`;
    }

    // フッター（トップは年データを読まないため、免責のみ表示する）
    function renderFooterSimple(site) {
      document.getElementById("footer-root").innerHTML =
        `${esc(site.siteName)} — ${esc(site.disclaimer)}`;
    }

    // 旧URL（index.html#meeting-... / #bills-... / #minutes など）で来た場合は会議録ページへ転送する
    function redirectLegacyHash() {
      const hash = location.hash;
      if (!hash) return false;
      if (/^#(meeting-|minutes|question-|bills-|petitions-|committee-)/.test(decodeURIComponent(hash))) {
        location.replace("kaigiroku.html" + hash);
        return true;
      }
      return false;
    }

    function init() {
      if (redirectLegacyHash()) return;
      const db = window.SHINAGAWA_DB;
      if (!db || !db.site) {
        showLoadError(new Error("data/site.js が読み込まれていません"));
        return;
      }
      const site = db.site;
      renderHero(site);
      renderSources(site);
      renderFooterSimple(site);
      window.addEventListener("hashchange", redirectLegacyHash);
    }

    init();
  </script>
  <script src="site-nav.js"></script>
  <script src="civic-data.js"></script>
  <script src="civic-content.js"></script>
  <script src="data/civic-sources.js"></script>
  <script src="civic-ui.js"></script>
  <script src="civic-legislation.js"></script>
  <script>
    (() => {
      const counts = document.getElementById("civic-home-counts");
      if (location.protocol === "file:") return;
      const script = document.createElement("script");
      script.src = "data/civic-counts.js";
      script.onload = () => {
        const data = window.SHINAGAWA_CIVIC_COUNTS;
        if (data) counts.textContent = `${data.year}の議案 ${data.bills}件 ／ 請願・陳情 ${data.petitions}件（収録件数）`;
      };
      script.onerror = () => { counts.textContent = "収録件数はデータ収録状況から確認できます。"; };
      document.head.append(script);
    })();
  </script>
  <script src="civic-page.js"></script>
  <script>
    /** @returns {Promise<void>} */
    async function renderRecentMeetings() {
      const outlet = document.getElementById("home-meetings");
      const db = window.SHINAGAWA_DB;
      const { loadYears } = window.SHINAGAWA_CIVIC;
      const rows = [];
      try {
        for (const year of db.site.years.filter(item => item.available)) {
          await loadYears([year.id]);
          const meetings = db.years[year.id].meetings || [];
          rows.push(...meetings.slice(-3).reverse().map(meeting => ({ ...meeting, year: year.id })));
          if (rows.length >= 3) break;
        }
        outlet.innerHTML = rows.length ? `<ul class="home-meetings">${rows.slice(0, 3).map(row => {
          const recap = "kaigi.html?" + new URLSearchParams({ year: row.year, meeting: row.id });
          const minutes = row.links?.find(item => item.type === "minutes");
          const video = row.links?.find(item => item.type === "video");
          const dailyLinks = (row.events || []).flatMap(event => event.links || []);
          const timeline = recap + "#timeline-" + row.id;
          const minutesUrl = minutes?.url || (dailyLinks.some(item => item.type === "minutes") ? timeline : "");
          const videoUrl = video?.url || (dailyLinks.some(item => item.type === "video") ? timeline : "");
          const resources = [
            minutesUrl && `<a href="${esc(minutesUrl)}" aria-label="${esc(row.name)}の会議録">会議録</a>`,
            videoUrl && `<a href="${esc(videoUrl)}" aria-label="${esc(row.name)}の録画">録画</a>`
          ].filter(Boolean);
          return `<li><span class="home-meetings__period">${esc(row.monthLabel)}</span>
            <a class="home-meetings__title" href="${esc(recap)}">${esc(row.name)}</a>
            <span class="home-meetings__resources">${resources.join("") || "会議録・録画リンク未収録"}</span></li>`;
        }).join("")}</ul>` : "<p>会議情報は未収録です。</p>";
      } catch (error) {
        window.SHINAGAWA_CIVIC_UI.showError(outlet, error);
      }
    }
    renderRecentMeetings();
  </script>
</body>
</html>
